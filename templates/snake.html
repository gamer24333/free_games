<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Snake - Tank Royale Portal</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #222;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header-bar {
            background-color: #161616;
            padding: 10px;
            text-align: center;
            border-bottom: 2px solid #2d2d2d;
            box-sizing: border-box;
            z-index: 10;
        }

        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 30px;
            padding: 20px;
            box-sizing: border-box;
            flex-wrap: wrap;
            overflow-y: auto;
        }

        .footer-bar {
            background-color: #161616;
            padding: 12px 10px;
            text-align: center;
            border-top: 2px solid #2d2d2d;
            font-size: 14px;
            color: #ccc;
            box-sizing: border-box;
            z-index: 10;
        }

        h1 {
            margin: 0;
            font-size: 22px;
            color: #39ff14;
            display: inline-block;
            vertical-align: middle;
        }

        .btn { display: inline-block; padding: 8px 16px; background: #555; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; border: none; cursor: pointer; font-size: 14px; }
        .btn:hover { background: #444; }
        .btn-back { float: left; }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .game-controls-info {
            display: flex;
            justify-content: space-between;
            width: 400px;
            font-size: 14px;
            color: #ccc;
            box-sizing: border-box;
            padding: 5px;
            background: #1a1a1a;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .fruit-legend {
            display: flex;
            gap: 15px;
            font-size: 13px;
        }

        #snakeCanvas {
            border: 4px solid #39ff14;
            border-radius: 12px;
            background: #111;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            display: block;
            box-sizing: border-box;
        }

        .leaderboard-box {
            background: #333;
            border: 2px solid #444;
            border-radius: 12px;
            width: 280px;
            padding: 20px;
            box-sizing: border-box;
            text-align: left;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .leaderboard-table th, .leaderboard-table td { padding: 6px 8px; border-bottom: 1px solid #444; text-align: left; font-size: 14px; }
        .leaderboard-table th { color: #39ff14; }
        .leaderboard-table tr:nth-child(1) td { color: #ffd700; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header-bar">
        <a href="/games" class="btn btn-back" onclick="stopMusic()">⬅️ Zurück</a>
        <h1>🐍 Retro Snake</h1>
    </div>

    <div class="main-content">
        <div class="game-container">
            <canvas id="snakeCanvas" width="400" height="400"></canvas>
            
            <div class="game-controls-info">
                <span>🎮 <b>WASD</b> / <b>Pfeile</b></span>
                <span class="fruit-legend">
                    <span style="color: #ff2e63;">🍎 +10</span>
                    <span style="color: #ffd700;">🟡 +20</span>
                    <span style="color: #9c27b0;">🟣 Gift!</span>
                </span>
                <span>Punkte: <b id="score" style="color: #76ff03;">0</b></span>
            </div>
        </div>

        <div class="leaderboard-box">
            <h3 style="margin-top: 0; color: #39ff14; text-align: center; margin-bottom: 5px;">🏆 Snake-Rangliste</h3>
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th>Platz</th>
                        <th>Name</th>
                        <th>Highscore</th>
                    </tr>
                </thead>
                <tbody>
                    {% for player, score in leaderboard %}
                    <tr>
                        <td>{{ loop.index }}.</td>
                        <td>{{ player }}</td>
                        <td>{{ score }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <div class="footer-bar">
        <span>Sammle Äpfel, meide das Gift (Lila) und werde zur längsten Schlange! 🚀</span>
    </div>

    <script>
        const canvas = document.getElementById('snakeCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        // Hintergrundmusik einrichten
        const bgMusic = new Audio('/static/snake.mp3');
        bgMusic.loop = true;
        bgMusic.volume = 0.4;

        function stopMusic() {
            bgMusic.pause();
            bgMusic.currentTime = 0;
        }

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [];
        let dx = 0;
        let dy = 0;
        let score = 0;
        let fruit = { x: 5, y: 5, type: 'normal' };
        let isGameOver = false;
        let gameStarted = false;
        let nextDx = 0;
        let nextDy = 0;

        function resetGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            dx = 1;
            dy = 0;
            nextDx = 1;
            nextDy = 0;
            score = 0;
            scoreEl.textContent = score;
            isGameOver = false;
            gameStarted = false;
            spawnFruit();
            
            bgMusic.pause();
            bgMusic.currentTime = 0;
        }

        // Steuerung mit den Pfeiltasten und WASD
        window.addEventListener('keydown', e => {
            const validKeys = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "w", "a", "s", "d", "W", "A", "S", "D", " "];
            
            if (validKeys.includes(e.key)) {
                e.preventDefault();
            }

            if (isGameOver && validKeys.includes(e.key)) {
                resetGame();
                gameStarted = true;
                bgMusic.play().catch(err => console.log("Autoplay verhindert:", err));
                return;
            }

            if (!gameStarted && validKeys.includes(e.key) && e.key !== " ") {
                gameStarted = true;
                bgMusic.play().catch(err => console.log("Autoplay verhindert:", err));
            }

            const key = e.key.toLowerCase();
            switch(key) {
                case 'arrowleft':
                case 'a':
                    if (dx === 0) { nextDx = -1; nextDy = 0; }
                    break;
                case 'arrowright':
                case 'd':
                    if (dx === 0) { nextDx = 1; nextDy = 0; }
                    break;
                case 'arrowup':
                case 'w':
                    if (dy === 0) { nextDx = 0; nextDy = -1; }
                    break;
                case 'arrowdown':
                case 's':
                    if (dy === 0) { nextDx = 0; nextDy = 1; }
                    break;
            }
        });

        function spawnFruit() {
            fruit.x = Math.floor(Math.random() * tileCount);
            fruit.y = Math.floor(Math.random() * tileCount);
            
            // Zufallsgenerator für Frucht-Typ
            let rand = Math.random();
            if (rand < 0.70) {
                fruit.type = 'normal'; // 70% Normaler Apfel
            } else if (rand < 0.85) {
                fruit.type = 'gold';   // 15% Goldener Apfel (Bonus)
            } else {
                fruit.type = 'poison'; // 15% Gift (Malus)
            }
            
            // Sicherstellen, dass Frucht nicht auf der Schlange spawnt
            snake.forEach(part => {
                if (part.x === fruit.x && part.y === fruit.y) {
                    spawnFruit();
                }
            });
        }

        function update() {
            if (!gameStarted || isGameOver) return;

            dx = nextDx;
            dy = nextDy;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Wändekollision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                triggerGameOver();
                return;
            }

            // Selbstkollision
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    triggerGameOver();
                    return;
                }
            }

            snake.unshift(head);

            // Frucht gegessen?
            if (head.x === fruit.x && head.y === fruit.y) {
                if (fruit.type === 'normal') {
                    score += 10;
                    // Kein .pop(), dadurch wächst sie um 1
                } 
                else if (fruit.type === 'gold') {
                    score += 20;
                    // Wächst direkt um 2 (eins durch fehlendes Pop, eins durch Push)
                    snake.push({...snake[snake.length - 1]}); 
                } 
                else if (fruit.type === 'poison') {
                    score = Math.max(0, score - 10); // Punkte abziehen (min. 0)
                    
                    // Stirbt, wenn die Schlange zu kurz wird (4 wegen dem unshift oben = Startgröße)
                    if (snake.length <= 4) { 
                        triggerGameOver();
                        return;
                    } else {
                        // Ein Pop für normale Bewegung, ein zweites Pop für das Schrumpfen!
                        snake.pop(); 
                        snake.pop(); 
                    }
                }
                scoreEl.textContent = score;
                spawnFruit();
            } else {
                // Normale Bewegung (letztes Glied entfernen)
                snake.pop();
            }
        }

        function draw() {
            // Hintergrund im Retro-Grid-Look
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Raster
            ctx.strokeStyle = '#181818';
            ctx.lineWidth = 1;
            for (let i = 0; i < tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // Frucht zeichnen
            let fx = fruit.x * gridSize;
            let fy = fruit.y * gridSize;
            
            if (fruit.type === 'normal') ctx.fillStyle = '#ff2e63';
            else if (fruit.type === 'gold') ctx.fillStyle = '#ffd700';
            else if (fruit.type === 'poison') ctx.fillStyle = '#9c27b0';

            ctx.beginPath();
            ctx.arc(fx + gridSize / 2, fy + gridSize / 2 + 1, gridSize / 2 - 3, 0, Math.PI * 2);
            ctx.fill();
            
            // Frucht-Stiel (Grünlich für Gift, Braun für den Rest)
            ctx.strokeStyle = fruit.type === 'poison' ? '#76ff03' : '#795548';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(fx + gridSize / 2, fy + 3);
            ctx.lineTo(fx + gridSize / 2 + 3, fy + 1);
            ctx.stroke();

            // Schlange zeichnen
            snake.forEach((part, index) => {
                let px = part.x * gridSize;
                let py = part.y * gridSize;
                
                // Kopf knallig neon-grün, Körper etwas dunkler
                ctx.fillStyle = index === 0 ? '#39ff14' : '#00adb5';
                
                ctx.beginPath();
                if (ctx.roundRect) {
                    ctx.roundRect(px + 1, py + 1, gridSize - 2, gridSize - 2, 6);
                } else {
                    ctx.rect(px + 1, py + 1, gridSize - 2, gridSize - 2);
                }
                ctx.fill();

                // Augen für den Kopf
                if (index === 0) {
                    ctx.fillStyle = '#000';
                    let eye1x = px + 6, eye1y = py + 6;
                    let eye2x = px + 12, eye2y = py + 6;
                    if (dx === 1) { eye1x = px + 12; eye1y = py + 5; eye2x = px + 12; eye2y = py + 13; }
                    else if (dx === -1) { eye1x = px + 6; eye1y = py + 5; eye2x = px + 6; eye2y = py + 13; }
                    else if (dy === 1) { eye1x = px + 5; eye1y = py + 12; eye2x = px + 13; eye2y = py + 12; }
                    
                    ctx.fillRect(eye1x, eye1y, 3, 3);
                    ctx.fillRect(eye2x, eye2y, 3, 3);
                }
            });

            // Start-Overlay
            if (!gameStarted && !isGameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#39ff14';
                ctx.font = 'bold 20px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Pfeiltasten oder WASD', canvas.width / 2, canvas.height / 2 - 10);
                ctx.fillStyle = '#fff';
                ctx.font = '14px Arial';
                ctx.fillText('zum Starten', canvas.width / 2, canvas.height / 2 + 20);
                ctx.textAlign = 'left';
            }

            // Game-Over Overlay
            if (isGameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#ff2e63';
                ctx.font = 'bold 28px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 15);
                
                ctx.fillStyle = '#fff';
                ctx.font = '15px Arial';
                ctx.fillText('Drücke eine Taste für Neustart', canvas.width / 2, canvas.height / 2 + 25);
                ctx.textAlign = 'left';
            }
        }

        async function triggerGameOver() {
            isGameOver = true;
            bgMusic.pause(); 

            try {
                await fetch('/api/submit-snake', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ score: score })
                });
            } catch(e) {
                console.error("Fehler beim Speichern des Scores", e);
            }
        }

        resetGame();
        setInterval(() => {
            update();
            draw();
        }, 120);
    </script>
</body>
</html>
