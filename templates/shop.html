<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shop & Inventar</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #222; color: white; margin-top: 40px; }
        .btn { display: inline-block; padding: 10px 20px; margin: 10px; background: #555; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; }
        .btn:hover { filter: brightness(1.2); }
        
        .shop-container { max-width: 600px; margin: 20px auto; background: #2a2a2a; border: 2px solid #e67e22; border-radius: 12px; padding: 30px; box-shadow: 0 0 20px rgba(230, 126, 34, 0.3); }
        .shop-tabs { display: flex; justify-content: center; margin-bottom: 20px; gap: 10px; }
        .shop-tab-btn { background: #444; color: #fff; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 16px; }
        .shop-tab-btn.active { background: #e67e22; }
        
        .category-title { color: #f1c40f; text-align: left; font-size: 20px; border-bottom: 1px solid #555; padding-bottom: 5px; margin-top: 25px; margin-bottom: 15px; }
        
        .shop-item { background: #333; border: 1px solid #555; border-radius: 8px; padding: 15px; margin-bottom: 15px; text-align: left; display: flex; justify-content: space-between; align-items: center; }
        .shop-item h4 { margin: 0 0 5px 0; font-size: 18px; color: #fff; }
        .shop-item p { margin: 0; font-size: 13px; color: #aaa; }
        
        .shop-btn { background: #27ae60; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .shop-btn.equip { background: #3498db; }
        .shop-btn.equipped { background: #f39c12; }
        .shop-btn.passive { background: #8e44ad; cursor: default; }
    </style>
</head>
<body>

    <a href="/welcome" class="btn" style="position: absolute; top: 20px; left: 20px;">⬅ Zurück</a>

    <h1 style="color: #e67e22;">🎒 Shop & Inventar</h1>
    <div style="font-size: 20px; font-weight: bold; margin-bottom: 20px;">
        Deine Münzen: <span id="coin-balance" style="color: #f1c40f;">{{ user_coins }} 🪙</span>
    </div>

    <div class="shop-container">
        <div class="shop-tabs">
            <button class="shop-tab-btn active" onclick="switchShopTab('shop')">🛒 Shop</button>
            <button class="shop-tab-btn" onclick="switchShopTab('inventory')">🎒 Mein Inventar</button>
        </div>

        <div id="shop-view">
            <p>Lädt Shop-Daten...</p>
        </div>

        <div id="inventory-view" style="display: none;">
            <p>Lädt Inventar...</p>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", loadShopData);

        function switchShopTab(tab) {
            const tabs = document.querySelectorAll('.shop-tab-btn');
            tabs.forEach(t => t.classList.remove('active'));
            
            if (tab === 'shop') {
                tabs[0].classList.add('active');
                document.getElementById('shop-view').style.display = 'block';
                document.getElementById('inventory-view').style.display = 'none';
            } else {
                tabs[1].classList.add('active');
                document.getElementById('shop-view').style.display = 'none';
                document.getElementById('inventory-view').style.display = 'block';
            }
        }

        async function loadShopData() {
            const res = await fetch('/api/shop/data');
            const data = await res.json();
            
            document.getElementById('coin-balance').textContent = data.coins + " 🪙";
            
            const shopView = document.getElementById('shop-view');
            const invView = document.getElementById('inventory-view');
            
            let shopItemsHTML = { "title": "", "color": "", "upgrade": "" };
            let invItemsHTML = { "title": "", "color": "", "upgrade": "" };
            
            let hasShopItems = false;
            let hasInvItems = false;

            for (const [id, item] of Object.entries(data.shop_items)) {
                // Inventar-Einträge können entweder Strings (Altlasten) oder Objekte {id, bought_at} sein
                const ownedEntry = data.inventory.find(i => (typeof i === 'string' ? i === id : i.id === id));
                const isOwned = !!ownedEntry;
                
                const type = item.type; // title, color, upgrade
                
                let isEquipped = false;
                if (type === 'title') {
                    isEquipped = Array.isArray(data.active_title) ? data.active_title.includes(item.value) : (data.active_title === item.value);
                } else if (type === 'color') {
                    isEquipped = (data.active_color === item.value);
                }

                if (!isOwned) {
                    if (item.rank_only) continue; // NEU: Rang-Titel nicht im Shop-Tab anzeigen!
                    
                    hasShopItems = true;
                    shopItemsHTML[type] += `
                    <div class="shop-item">
                        <div>
                            <h4>${item.name}</h4><p>${item.desc}</p>
                        </div>
                        <button class="shop-btn" onclick="buyItem('${id}')">${item.price} 🪙</button>
                    </div>`;
                }
                
                if (isOwned) {
                    hasInvItems = true;
                    
                    // Prüfen, ob das Item innerhalb der letzten 24 Stunden gekauft wurde und einen Preis hat
                    let returnButtonHTML = '';
                    if (typeof ownedEntry === 'object' && ownedEntry.bought_at && item.price > 0) {
                        const boughtTime = new Date(ownedEntry.bought_at).getTime();
                        const nowTime = new Date().getTime();
                        const hoursLeft = 24 - ((nowTime - boughtTime) / (1000 * 60 * 60));
                        if (hoursLeft > 0) {
                            returnButtonHTML = `<button class="shop-btn" onclick="returnItem('${id}')" style="background: #e74c3c; margin-left: 8px;" title="Noch ${Math.ceil(hoursLeft)} Std. rückgabeberechtig">🔄 Zurückgeben (${item.price} 🪙)</button>`;
                        }
                    }
                    
                    if (type === 'upgrade') {
                        invItemsHTML[type] += `
                        <div class="shop-item">
                            <div>
                                <h4>${item.name}</h4><p>${item.desc}</p>
                            </div>
                            <div style="display: flex; align-items: center;">
                                <button class="shop-btn passive">Permanent aktiv</button>
                                ${returnButtonHTML}
                            </div>
                        </div>`;
                    } else if (type === 'lootbox') {
                        // Kisten können geöffnet werden
                        invItemsHTML.color += `
                        <div class="shop-item">
                            <div>
                                <h4>${item.name}</h4><p>${item.desc}</p>
                            </div>
                            <button class="shop-btn" style="background: #8e44ad;" onclick="openBox('${id}')">🎁 Öffnen</button>
                        </div>`;
                    } else {
                        // Normale Farben und Titel
                        invItemsHTML[type] += `
                        <div class="shop-item">
                            <div>
                                <h4>${item.name}</h4><p>${item.desc}</p>
                            </div>
                            <div style="display: flex; align-items: center;">
                                <button class="shop-btn ${isEquipped ? 'equipped' : 'equip'}" onclick="equipItem('${id}')">
                                    ${isEquipped ? 'Ausgerüstet' : 'Ausrüsten'}
                                </button>
                                ${returnButtonHTML}
                            </div>
                        </div>`;
                    }
            
            shopView.innerHTML = "";
            if(shopItemsHTML.color) shopView.innerHTML += `<div class="category-title">🎨 Chat-Farben (Skins)</div>` + shopItemsHTML.color;
            if(shopItemsHTML.title) shopView.innerHTML += `<div class="category-title">🏷️ Chat-Titel</div>` + shopItemsHTML.title;
            if(shopItemsHTML.upgrade) shopView.innerHTML += `<div class="category-title">⚡ Spiel-Upgrades</div>` + shopItemsHTML.upgrade;
            
            if (!hasShopItems) shopView.innerHTML = '<p>Du hast bereits alles gekauft, was es gibt!</p>';

            invView.innerHTML = "";
            if(invItemsHTML.color) invView.innerHTML += `<div class="category-title">🎨 Chat-Farben (Skins)</div>` + invItemsHTML.color;
            if(invItemsHTML.title) invView.innerHTML += `<div class="category-title">🏷️ Chat-Titel</div>` + invItemsHTML.title;
            if(invItemsHTML.upgrade) invView.innerHTML += `<div class="category-title">⚡ Spiel-Upgrades</div>` + invItemsHTML.upgrade;
            
            if (!hasInvItems) invView.innerHTML = '<p>Dein Inventar ist noch leer.</p>';
        }

        async function openBox(itemId) {
            if (!confirm("Möchtest du diese Kiste jetzt öffnen?")) return;
            const res = await fetch('/api/shop/open-box', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ item_id: itemId })
            });
            const data = await res.json();
            if (res.ok) {
                alert("🎉 " + data.message);
                loadShopData(); // Inventar und Coins sofort updaten!
            } else {
                alert("❌ " + data.error);
            }
        }
        
        async function buyItem(itemId) {
            const res = await fetch('/api/shop/buy', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ item_id: itemId })
            });
            const data = await res.json();
            if (res.ok) { loadShopData(); } 
            else { alert("❌ " + data.error); }
        }

        async function equipItem(itemId) {
            const res = await fetch('/api/shop/equip', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ item_id: itemId })
            });
            if (res.ok) { loadShopData(); }
        }

        async function returnItem(itemId) {
            if (!confirm("Möchtest du dieses Item wirklich zurückgeben und deine Münzen vollständig erstattet bekommen?")) return;
            const res = await fetch('/api/shop/return', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ item_id: itemId })
            });
            const data = await res.json();
            if (res.ok) {
                alert("✅ Item erfolgreich zurückgegeben!");
                loadShopData();
            } else {
                alert("❌ " + (data.error || "Fehler beim Rückgabeprozess."));
            }
        }
    </script>
</body>
</html>
