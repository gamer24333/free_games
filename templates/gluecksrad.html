<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glücksrad</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #222; color: white; margin-top: 30px; user-select: none; }
        .btn { display: inline-block; padding: 12px 25px; background: #9b59b6; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; font-size: 18px; margin-top: 15px;}
        .btn:hover { background: #8e44ad; }
        
        .wheel-area {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 30px auto;
        }

        /* Der verborgene Code, der hinter dem Rad liegt */
        .hidden-code-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1a1a;
            border: 2px dashed #9b59b6;
            padding: 20px;
            border-radius: 12px;
            width: 200px;
            text-align: center;
            box-shadow: 0 0 15px rgba(155, 89, 182, 0.3);
            z-index: 1;
        }

        .wheel-wrapper {
            position: absolute;
            top: 0;
            left: 20px;
            width: 280px;
            height: 280px;
            z-index: 5;
            cursor: grab;
            touch-action: none;
            transition: transform 0.2s ease-out;
        }
        .wheel-wrapper:active { cursor: grabbing; }

        .wheel-container {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            border: 6px solid #f1c40f;
            background: conic-gradient(
                #e74c3c 0deg 216deg,      /* Niete: 60% */
                #3498db 216deg 306deg,   /* 20 Münzen: 25% */
                #2ecc71 306deg 342deg,   /* 50 Münzen: 10% */
                #f1c40f 342deg 356.4deg, /* Jackpot: 4% */
                #9b59b6 356.4deg 360deg  /* XP-Boost: 1% */
            );
            position: relative;
            transition: transform 3s cubic-bezier(0.25, 0.1, 0.25, 1);
            box-shadow: 0 0 30px rgba(241, 196, 15, 0.4);
        }

        .pointer {
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid white;
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        /* Übersicht / Legende der Gewinnchancen */
        .odds-box {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 10px;
            max-width: 340px;
            margin: 20px auto;
            padding: 15px;
            text-align: left;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .odds-box h3 { margin-top: 0; font-size: 15px; color: #f1c40f; text-align: center; border-bottom: 1px solid #444; padding-bottom: 8px; }
        .odd-item { display: flex; align-items: center; justify-content: space-between; font-size: 13px; margin: 8px 0; color: #ccc; }
        .color-dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; margin-right: 8px; flex-shrink: 0; }

        #result { margin-top: 20px; font-size: 22px; font-weight: bold; color: #f1c40f; height: 30px; }
    </style>
</head>
<body>

    <a href="/welcome" class="btn" style="position: absolute; top: 20px; left: 20px; font-size: 14px; background: #555;">⬅ Zurück</a>

    <h1 style="color: #9b59b6; margin-top: 40px;">🎰 Das Glücksrad</h1>
    <p>Einsatz: <b>15 Münzen</b> pro Drehung. Deine Münzen: <span id="coinBalance" style="color: #f1c40f;">{{ coins }} 🪙</span></p>

    <!-- Rad & Versteckter Code Bereich -->
    <div class="wheel-area">
        <!-- Versteckter Code darunter -->
        <div class="hidden-code-box">
            <span style="font-size: 12px; color: #aaa;">✨ Gefunden! ✨</span>
            <p style="margin: 5px 0 2px 0; font-size: 13px; color: #ccc;">Geheimer XP-Code:</p>
            <b style="color: #f1c40f; font-size: 16px; letter-spacing: 1px; user-select: all;">WHEELXP</b>
        </div>

        <!-- Verschiebbares Rad -->
        <div class="wheel-wrapper" id="wheelWrapper">
            <div class="pointer"></div>
            <div class="wheel-container" id="wheel"></div>
        </div>
    </div>

    <button class="btn" id="spinBtn" onclick="spinWheel()">Drehen (15 🪙)</button>
    <div id="result"></div>

    <!-- Übersicht der Gewinnchancen -->
    <div class="odds-box">
        <h3>📊 Segmente & Gewinnchancen</h3>
        <div class="odd-item"><span style="display: flex; align-items: center;"><span class="color-dot" style="background: #e74c3c;"></span>😭 Niete (0 🪙)</span> <strong>60%</strong></div>
        <div class="odd-item"><span style="display: flex; align-items: center;"><span class="color-dot" style="background: #3498db;"></span>🪙 20 Münzen</span> <strong>25%</strong></div>
        <div class="odd-item"><span style="display: flex; align-items: center;"><span class="color-dot" style="background: #2ecc71;"></span>💰 50 Münzen</span> <strong>10%</strong></div>
        <div class="odd-item"><span style="display: flex; align-items: center;"><span class="color-dot" style="background: #f1c40f;"></span>💎 Jackpot (100 🪙)</span> <strong>4%</strong></div>
        <div class="odd-item"><span style="display: flex; align-items: center;"><span class="color-dot" style="background: #9b59b6;"></span>🌟 XP-Boost (+1000 XP)</span> <strong>1%</strong></div>
    </div>

    <script>
        let currentRotation = 0;
        let isSpinning = false;

        // Verschiebe-Logik per Maus / Touch (Drag & Drop fürs Rad)
        const wheelWrapper = document.getElementById('wheelWrapper');
        let isDragging = false;
        let startX = 0;
        let currentX = 0;

        wheelWrapper.addEventListener('pointerdown', (e) => {
            isDragging = true;
            startX = e.clientX - currentX;
            wheelWrapper.setPointerCapture(e.pointerId);
        });

        wheelWrapper.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            currentX = e.clientX - startX;
            // Begrenzung, damit man es nicht komplett aus dem Bildschirm zieht
            if (currentX < -230) currentX = -230;
            if (currentX > 230) currentX = 230;
            wheelWrapper.style.transform = `translateX(${currentX}px)`;
        });

        wheelWrapper.addEventListener('pointerup', (e) => {
            isDragging = false;
            wheelWrapper.releasePointerCapture(e.pointerId);
        });

        // Angepasste Grad-Bereiche für die Segmentgrößen
        const segmentAngles = {
            'niete': {min: 10, max: 200},
            '20coins': {min: 226, max: 296},
            '50coins': {min: 312, max: 338},
            'jackpot': {min: 345, max: 353},
            'xp': {min: 357, max: 359}
        };

        async function spinWheel() {
            if (isSpinning) return;
            
            const resultDiv = document.getElementById('result');
            const wheel = document.getElementById('wheel');
            const coinSpan = document.getElementById('coinBalance');
            
            resultDiv.textContent = "";

            try {
                const res = await fetch('/api/spin-wheel', { method: 'POST' });
                const data = await res.json();
                
                if (!res.ok) {
                    alert("❌ " + data.error);
                    return;
                }

                isSpinning = true;
                document.getElementById('spinBtn').style.opacity = '0.5';

                const range = segmentAngles[data.segment] || {min: 10, max: 200};
                const targetAngle = Math.floor(Math.random() * (range.max - range.min + 1)) + range.min;

                const targetMod = (360 - targetAngle) % 360;
                const currentMod = currentRotation % 360;
                let diff = targetMod - currentMod;
                if (diff <= 0) diff += 360;

                const extraSpins = 360 * 5; 
                currentRotation += extraSpins + diff;
                
                wheel.style.transform = `rotate(${currentRotation}deg)`;

                setTimeout(() => {
                    resultDiv.textContent = data.text;
                    coinSpan.textContent = data.new_balance + " 🪙";
                    isSpinning = false;
                    document.getElementById('spinBtn').style.opacity = '1';
                }, 3000);

            } catch (e) {
                alert("Verbindungsfehler.");
            }
        }
    </script>
</body>
</html>
