<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glücksrad</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #222; color: white; margin-top: 30px; }
        .btn { display: inline-block; padding: 12px 25px; background: #9b59b6; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; font-size: 18px; margin-top: 15px;}
        .btn:hover { background: #8e44ad; }
        
        .wheel-container {
            margin: 30px auto;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            border: 6px solid #f1c40f;
            background: conic-gradient(
                #e74c3c 0deg 72deg,
                #3498db 72deg 144deg,
                #2ecc71 144deg 216deg,
                #f1c40f 216deg 288deg,
                #9b59b6 288deg 360deg
            );
            position: relative;
            transition: transform 3s cubic-bezier(0.25, 0.1, 0.25, 1);
            box-shadow: 0 0 30px rgba(241, 196, 15, 0.4);
        }
        
        /* Sauber zentrierte Beschriftungen auf den Segmenten */
        .wheel-label {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 90px;
            height: 40px;
            margin-top: -20px;
            margin-left: -45px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .pointer {
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid white;
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        /* Box für die Gewinnchancen */
        .odds-box {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 10px;
            max-width: 320px;
            margin: 20px auto;
            padding: 15px;
            text-align: left;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .odds-box h3 { margin-top: 0; font-size: 15px; color: #f1c40f; text-align: center; border-bottom: 1px solid #444; padding-bottom: 8px; }
        .odd-item { display: flex; justify-content: space-between; font-size: 13px; margin: 6px 0; color: #ccc; }

        #result { margin-top: 20px; font-size: 22px; font-weight: bold; color: #f1c40f; height: 30px; }
    </style>
</head>
<body>

    <a href="/welcome" class="btn" style="position: absolute; top: 20px; left: 20px; font-size: 14px; background: #555;">⬅ Zurück</a>

    <h1 style="color: #9b59b6; margin-top: 40px;">🎰 Das Glücksrad</h1>
    <p>Einsatz: <b>15 Münzen</b> pro Drehung. Deine Münzen: <span id="coinBalance" style="color: #f1c40f;">{{ coins }} 🪙</span></p>

    <div style="position: relative; width: 280px; margin: 0 auto;">
        <div class="pointer"></div>
        <div class="wheel-container" id="wheel">
            <!-- Beschriftungen mit integrierten Wahrscheinlichkeiten -->
            <div class="wheel-label" style="transform: rotate(36deg) translate(80px) rotate(90deg);"><span>Niete</span><span style="font-size: 10px; color: #ff9999;">40%</span></div>
            <div class="wheel-label" style="transform: rotate(108deg) translate(80px) rotate(90deg);"><span>20 🪙</span><span style="font-size: 10px; color: #99ccff;">30%</span></div>
            <div class="wheel-label" style="transform: rotate(180deg) translate(80px) rotate(90deg);"><span>50 🪙</span><span style="font-size: 10px; color: #99ff99;">20%</span></div>
            <div class="wheel-label" style="transform: rotate(252deg) translate(80px) rotate(90deg);"><span>JACKPOT</span><span style="font-size: 10px; color: #ffee55;">8%</span></div>
            <div class="wheel-label" style="transform: rotate(324deg) translate(80px) rotate(90deg);"><span>+50 XP</span><span style="font-size: 10px; color: #dda0dd;">2%</span></div>
        </div>
    </div>

    <button class="btn" id="spinBtn" onclick="spinWheel()">Drehen (15 🪙)</button>
    <div id="result"></div>

    <!-- Übersicht der Gewinnchancen -->
    <div class="odds-box">
        <h3>📊 Gewinnchancen</h3>
        <div class="odd-item"><span>😭 Niete (0 🪙)</span> <strong>40%</strong></div>
        <div class="odd-item"><span>🪙 20 Münzen</span> <strong>30%</strong></div>
        <div class="odd-item"><span>💰 50 Münzen</span> <strong>20%</strong></div>
        <div class="odd-item"><span>💎 Jackpot (100 🪙)</span> <strong>8%</strong></div>
        <div class="odd-item"><span>🌟 XP-Boost (+50 XP)</span> <strong>2%</strong></div>
    </div>

    <script>
        let currentRotation = 0;
        let isSpinning = false;

        async function spinWheel() {
            if (isSpinning) return;
            
            const resultDiv = document.getElementById('result');
            const wheel = document.getElementById('wheel');
            const coinSpan = document.getElementById('coinBalance');
            
            resultDiv.textContent = "";

            try {
                const res = await fetch('/api/spin-wheel', { method: 'POST' });
                const data = await res.json();
                
                if (!res.ok) {
                    alert("❌ " + data.error);
                    return;
                }

                isSpinning = true;
                document.getElementById('spinBtn').style.opacity = '0.5';

                const extraSpins = 360 * 5; 
                const randomOffset = Math.floor(Math.random() * 360);
                currentRotation += extraSpins + randomOffset;
                
                wheel.style.transform = `rotate(${currentRotation}deg)`;

                setTimeout(() => {
                    resultDiv.textContent = data.text;
                    coinSpan.textContent = data.new_balance + " 🪙";
                    isSpinning = false;
                    document.getElementById('spinBtn').style.opacity = '1';
                }, 3000);

            } catch (e) {
                alert("Verbindungsfehler.");
            }
        }
    </script>
</body>
</html>
