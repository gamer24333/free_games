<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glücksrad</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #222; color: white; margin-top: 30px; }
        .btn { display: inline-block; padding: 12px 25px; background: #9b59b6; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; font-size: 18px; margin-top: 15px;}
        .btn:hover { background: #8e44ad; }
        
        .wheel-container {
            margin: 30px auto;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            border: 6px solid #f1c40f;
            /* Exakte Segment-Grössen passend zu den Wahrscheinlichkeiten im Backend */
            background: conic-gradient(
                #e74c3c 0deg 144deg,
                #3498db 144deg 252deg,
                #2ecc71 252deg 324deg,
                #f1c40f 324deg 352.8deg,
                #9b59b6 352.8deg 360deg
            );
            position: relative;
            transition: transform 3s cubic-bezier(0.25, 0.1, 0.25, 1);
            box-shadow: 0 0 30px rgba(241, 196, 15, 0.4);
        }

        .pointer {
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid white;
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        /* Übersicht / Legende der Gewinnchancen */
        .odds-box {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 10px;
            max-width: 340px;
            margin: 20px auto;
            padding: 15px;
            text-align: left;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .odds-box h3 { margin-top: 0; font-size: 15px; color: #f1c40f; text-align: center; border-bottom: 1px solid #444; padding-bottom: 8px; }
        .odd-item { display: flex; align-items: center; justify-content: space-between; font-size: 13px; margin: 8px 0; color: #ccc; }
        .color-dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; margin-right: 8px; flex-shrink: 0; }

        #result { margin-top: 20px; font-size: 22px; font-weight: bold; color: #f1c40f; height: 30px; }
    </style>
</head>
<body>

    <a href="/welcome" class="btn" style="position: absolute; top: 20px; left: 20px; font-size: 14px; background: #555;">⬅ Zurück</a>

    <h1 style="color: #9b59b6; margin-top: 40px;">🎰 Das Glücksrad</h1>
    <p>Einsatz: <b>15 Münzen</b> pro Drehung. Deine Münzen: <span id="coinBalance" style="color: #f1c40f;">{{ coins }} 🪙</span></p>

    <div style="position: relative; width: 280px; margin: 0 auto;">
        <div class="pointer"></div>
        <div class="wheel-container" id="wheel"></div>
    </div>

    <button class="btn" id="spinBtn" onclick="spinWheel()">Drehen (15 🪙)</button>
    <div id="result"></div>

    <!-- Übersicht der Gewinnchancen mit Farbmarkierung -->
    <div class="odds-box">
        <h3>📊 Segmente & Gewinnchancen</h3>
        <div class="odd-item"><span style="display: flex; align-items: center;"><span class="color-dot" style="background: #e74c3c;"></span>😭 Niete (0 🪙)</span> <strong>40%</strong></div>
        <div class="odd-item"><span style="display: flex; align-items: center;"><span class="color-dot" style="background: #3498db;"></span>🪙 20 Münzen</span> <strong>30%</strong></div>
        <div class="odd-item"><span style="display: flex; align-items: center;"><span class="color-dot" style="background: #2ecc71;"></span>💰 50 Münzen</span> <strong>20%</strong></div>
        <div class="odd-item"><span style="display: flex; align-items: center;"><span class="color-dot" style="background: #f1c40f;"></span>💎 Jackpot (100 🪙)</span> <strong>8%</strong></div>
        <div class="odd-item"><span style="display: flex; align-items: center;"><span class="color-dot" style="background: #9b59b6;"></span>🌟 XP-Boost (+50 XP)</span> <strong>2%</strong></div>
    </div>

    <script>
        let currentRotation = 0;
        let isSpinning = false;

        async function spinWheel() {
            if (isSpinning) return;
            
            const resultDiv = document.getElementById('result');
            const wheel = document.getElementById('wheel');
            const coinSpan = document.getElementById('coinBalance');
            
            resultDiv.textContent = "";

            try {
                const res = await fetch('/api/spin-wheel', { method: 'POST' });
                const data = await res.json();
                
                if (!res.ok) {
                    alert("❌ " + data.error);
                    return;
                }

                isSpinning = true;
                document.getElementById('spinBtn').style.opacity = '0.5';

                const extraSpins = 360 * 5; 
                const randomOffset = Math.floor(Math.random() * 360);
                currentRotation += extraSpins + randomOffset;
                
                wheel.style.transform = `rotate(${currentRotation}deg)`;

                setTimeout(() => {
                    resultDiv.textContent = data.text;
                    coinSpan.textContent = data.new_balance + " 🪙";
                    isSpinning = false;
                    document.getElementById('spinBtn').style.opacity = '1';
                }, 3000);

            } catch (e) {
                alert("Verbindungsfehler.");
            }
        }
    </script>
</body>
</html>
