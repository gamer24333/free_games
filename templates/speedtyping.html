<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Typing</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #222; color: white; margin: 0; padding: 20px; text-align: center; }
        h1 { color: #00adb5; margin-top: 0; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; max-width: 1100px; margin: 0 auto 20px auto; }
        
        .main-wrapper {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 30px;
            max-width: 1100px;
            margin: 0 auto;
            flex-wrap: wrap;
        }

        /* Spiel-Bereich */
        .game-container { 
            flex: 1; 
            min-width: 350px; 
            background: #333; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            border: 2px solid #00adb5; 
            position: relative;
        }

        /* Vollbild-Modus (greift nur, wenn die .game-container im Vollbild ist) */
        .game-container:fullscreen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #222;
            border: none;
            border-radius: 0;
            padding: 50px;
        }
        .game-container:fullscreen #word-display {
            width: 90%;
            max-width: 900px;
            height: auto;
            max-height: 250px;
            font-size: 32px;
        }
        .game-container:fullscreen #input-field {
            max-width: 600px;
            font-size: 36px;
            padding: 20px;
        }
        
        .stats-bar { 
            display: flex; 
            justify-content: center; 
            align-items: center;
            gap: 40px; 
            margin-bottom: 20px; 
            position: relative; 
            width: 100%;
        }
        
        .stat-box { font-size: 48px; font-weight: bold; }
        #timer { color: #ff2e63; }
        #live-wpm { color: #2ecc71; }

        /* Vollbild-Button im Spielfeld */
        #fullscreen-btn {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            margin: 0;
            padding: 8px 12px;
            font-size: 14px;
            background: #555;
        }
        
        #word-display {
            background: #222; border-radius: 8px; padding: 20px; font-size: 24px;
            display: flex; flex-wrap: wrap; gap: 10px; height: 120px; overflow: hidden;
            border: 1px solid #555; text-align: left; align-items: flex-start; align-content: flex-start;
            user-select: none;
        }
        
        .word { padding: 2px 5px; border-radius: 4px; color: #aaa; transition: background 0.2s; }
        .word.active { background: #555; color: white; border-bottom: 3px solid #00adb5; }
        .word.correct { color: #2ecc71; }
        .word.incorrect { color: #ff2e63; text-decoration: line-through; }

        #input-field {
            width: 100%; max-width: 400px; font-size: 24px; padding: 15px; margin-top: 30px;
            border-radius: 8px; border: 2px solid #00adb5; background: #222; color: white;
            text-align: center; outline: none; box-sizing: border-box;
        }
        #input-field:focus { box-shadow: 0 0 10px #00adb5; }
        #input-field:disabled { background: #444; border-color: #555; color: #888; }

        .btn { display: inline-block; padding: 10px 20px; background: #00adb5; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; border: none; cursor: pointer; font-size: 16px; }
        .btn:hover { background: #007c82; }
        
        /* Rangliste */
        .leaderboard { 
            width: 320px; 
            background: #2a2a2a; 
            padding: 20px; 
            border-radius: 12px; 
            border: 2px solid #555;
        }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border-bottom: 1px solid #444; text-align: center; }
        th { background: #00adb5; color: white; }
        tr:hover { background: #444; }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="/games" class="btn" style="background: #555;">Zurück</a>
        <h1>⌨️ Speed Typing</h1>
        <div style="width: 80px;"></div> <!-- Platzhalter für symmetrisches Layout -->
    </div>
    
    <div class="main-wrapper">
        <div class="game-container" id="game-container">
            <div class="stats-bar">
                <div class="stat-box" id="timer">60s</div>
                <div class="stat-box" id="live-wpm">0 <span style="font-size: 20px;">WPM</span></div>
                <button class="btn" id="fullscreen-btn" onclick="toggleFullscreen()" title="Vollbildmodus (F)">📺 Vollbild</button>
            </div>
            
            <div id="word-display"></div>
            
            <input type="text" id="input-field" placeholder="Tippe hier, um zu starten..." autocomplete="off">
            <br>
            <button class="btn" id="restart-btn" style="display: none; margin-top: 20px;" onclick="initGame()">Nochmal spielen</button>
        </div>

        <div class="leaderboard">
            <h2 style="color: #2ecc71; margin-top: 0;">🏆 Top 10</h2>
            <table>
                <tr><th>Rang</th><th>Spieler</th><th>WPM</th></tr>
                {% for player, score in leaderboard[:10] %}
                <tr>
                    <td>#{{ loop.index }}</td>
                    <td>{{ player }}</td>
                    <td><b>{{ score }}</b></td>
                </tr>
                {% endfor %}
            </table>
        </div>
    </div>

    <script>
        // --- WEB AUDIO API (MUSIK) ---
        let audioCtx;
        let audioBuffer;
        let bgmSource;
        let gainNode;

        async function initAudio() {
            try {
                window.AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                
                gainNode = audioCtx.createGain();
                gainNode.gain.value = 0.4; 
                gainNode.connect(audioCtx.destination);

                const response = await fetch('/static/speedtyping.mp3');
                const arrayBuffer = await response.arrayBuffer();
                audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            } catch (err) {
                console.error("Fehler beim Laden der Musik:", err);
            }
        }

        function playMusic() {
            if (!audioCtx || !audioBuffer) return;
            
            if (audioCtx.state === 'suspended') {
                audioCtx.resume(); // Wird beim ersten Tastendruck entsperrt
            }

            if (bgmSource) bgmSource.stop(); 
            
            bgmSource = audioCtx.createBufferSource();
            bgmSource.buffer = audioBuffer;
            bgmSource.loop = true; 
            bgmSource.connect(gainNode);
            bgmSource.start();
        }

        function stopMusic() {
            if (bgmSource) {
                bgmSource.stop();
                bgmSource = null;
            }
        }

        // --- SPIEL LOGIK ---
        const wordPool = [
            "haus", "schule", "lernen", "freunde", "computer", "spielen", "laufen", "wasser", "sonne", "mond",
            "klasse", "lehrer", "pause", "essen", "trinken", "auto", "fahrrad", "musik", "film", "buch",
            "schreiben", "lesen", "schnell", "langsam", "heute", "morgen", "gestern", "immer", "nie", "oft",
            "katze", "hund", "vogel", "baum", "blume", "wald", "wiese", "berg", "fluss", "meer",
            "apfel", "banane", "kuchen", "pizza", "burger", "nase", "auge", "ohr", "hand", "fuß",
            "lustig", "traurig", "schön", "hässlich", "groß", "klein", "kalt", "warm", "heiß", "cool",
            "frage", "antwort", "wissen", "denken", "glauben", "hoffen", "lieben", "lachen", "weinen", "schreien",
            "woche", "monat", "jahr", "stunde", "minute", "sekunde", "zeit", "uhr", "tag", "nacht",
            "rot", "blau", "gelb", "grün", "schwarz", "weiß", "grau", "braun", "lila", "rosa"
        ];

        let words = [];
        let currentWordIndex = 0;
        let correctWords = 0;
        let timeLeft = 60;
        let timerInterval;
        let isPlaying = false;

        const display = document.getElementById('word-display');
        const input = document.getElementById('input-field');
        const timerDisplay = document.getElementById('timer');
        const liveWpmDisplay = document.getElementById('live-wpm');
        const restartBtn = document.getElementById('restart-btn');

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initGame() {
            words = shuffleArray([...wordPool]).slice(0, 100); 
            currentWordIndex = 0;
            correctWords = 0;
            timeLeft = 60;
            isPlaying = false;
            
            clearInterval(timerInterval);
            timerDisplay.innerHTML = timeLeft + "s";
            liveWpmDisplay.innerHTML = `0 <span style="font-size: 20px;">WPM</span>`;
            
            input.value = "";
            input.disabled = false;
            restartBtn.style.display = "none";
            display.scrollTop = 0; 
            
            renderWords();
            input.focus();
        }

        function renderWords() {
            display.innerHTML = "";
            words.forEach((word, index) => {
                const span = document.createElement('span');
                span.textContent = word;
                span.className = 'word';
                if (index === currentWordIndex) span.classList.add('active');
                display.appendChild(span);
            });
        }

        function startGame() {
            if (isPlaying) return;
            isPlaying = true;
            
            playMusic(); // <-- Musik startet vollautomatisch
            
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft + "s";
                updateLiveWpm();
                
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function updateLiveWpm() {
            let timePassed = 60 - timeLeft;
            if (timePassed > 0) {
                let currentWpm = Math.round((correctWords / timePassed) * 60);
                liveWpmDisplay.innerHTML = `${currentWpm} <span style="font-size: 20px;">WPM</span>`;
            }
        }

        function endGame() {
            clearInterval(timerInterval);
            isPlaying = false;
            input.disabled = true;
            
            stopMusic(); // <-- Musik stoppt vollautomatisch
            
            const wpm = correctWords;
            timerDisplay.innerHTML = `<span style="font-size: 32px;">Fertig!</span>`;
            liveWpmDisplay.innerHTML = `${wpm} <span style="font-size: 20px;">WPM</span>`;
            restartBtn.style.display = "inline-block";

            if (wpm > 0) {
                fetch('/api/submit-speedtyping', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ score: wpm })
                }).then(() => {
                    setTimeout(() => location.reload(), 3000); 
                });
            }
        }

        // Leertaste abfangen & prüfen über keydown (Ignoriert Großschreibung!)
        input.addEventListener('keydown', (e) => {
            if (e.key === ' ') {
                e.preventDefault(); 
                
                // toLowerCase() macht iPad-Eingaben "Hund" und "hund" identisch
                const typedValue = input.value.trim().toLowerCase();
                if (typedValue.length === 0) return; 

                if (!isPlaying) startGame();

                const wordSpans = display.querySelectorAll('.word');
                const currentSpan = wordSpans[currentWordIndex];
                const targetWord = words[currentWordIndex].toLowerCase();
                
                if (typedValue === targetWord) {
                    currentSpan.classList.replace('active', 'correct');
                    correctWords++;
                } else {
                    currentSpan.classList.replace('active', 'incorrect');
                }
                
                input.value = "";
                currentWordIndex++;
                updateLiveWpm(); 
                
                if (currentWordIndex < words.length) {
                    const nextSpan = wordSpans[currentWordIndex];
                    nextSpan.classList.add('active');
                    
                    // Sauberes Scrollen der Box
                    const displayRect = display.getBoundingClientRect();
                    const spanRect = nextSpan.getBoundingClientRect();
                    
                    if (spanRect.bottom > displayRect.bottom) {
                        display.scrollTop += nextSpan.offsetHeight + 10;
                    }
                } else {
                    endGame(); 
                }
            }
        });

        // Live Eingabe-Feedback (Ignoriert Großschreibung für iPad)
        input.addEventListener('input', (e) => {
            if (!isPlaying && input.value.trim().length > 0) startGame();
            
            const typedValue = input.value.trim().toLowerCase();
            if (typedValue.length === 0) return;
            
            const wordSpans = display.querySelectorAll('.word');
            const currentSpan = wordSpans[currentWordIndex];
            const targetWord = words[currentWordIndex].toLowerCase();
            
            if (!targetWord.startsWith(typedValue)) {
                currentSpan.style.backgroundColor = "rgba(255, 46, 99, 0.3)";
            } else {
                currentSpan.style.backgroundColor = "";
            }
        });

        // --- FOKUS-VOLLBILD LOGIK ---
        function toggleFullscreen() {
            // Wir versetzen nur die game-container in den Vollbildmodus!
            const gameContainer = document.getElementById("game-container");
            const btn = document.getElementById("fullscreen-btn");
            
            if (!document.fullscreenElement) {
                if (gameContainer.requestFullscreen) {
                    gameContainer.requestFullscreen()
                        .then(() => btn.textContent = "📺 Beenden")
                        .catch(err => console.error(err));
                } else if (gameContainer.webkitRequestFullscreen) { /* Safari / iPad Support */
                    gameContainer.webkitRequestFullscreen();
                    btn.textContent = "📺 Beenden";
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen()
                        .then(() => btn.textContent = "📺 Vollbild");
                } else if (document.webkitExitFullscreen) { /* Safari / iPad Support */
                    document.webkitExitFullscreen();
                    btn.textContent = "📺 Vollbild";
                }
            }
            btn.blur(); 
        }

        // F-Taste für Vollbild (ignoriert, solange das Input-Feld fokussiert ist)
        document.addEventListener("keydown", function(event) {
            if ((event.key === "f" || event.key === "F") && document.activeElement !== input) {
                event.preventDefault();
                toggleFullscreen();
            }
        });

        // Audio initialisieren, sobald die Seite geladen ist
        window.addEventListener('DOMContentLoaded', initAudio);
        initGame();
        
        // --- AFK Detection (Anti-Farm System) ---
        let isAFK = false;
        let afkTimer;
        
        // Reset timer if the user moves the mouse, clicks, or presses a key
        function resetAFK() {
            isAFK = false;
            clearTimeout(afkTimer);
            // If the user does nothing for 2 minutes (120,000 ms), they are AFK
            afkTimer = setTimeout(() => {
                isAFK = true;
                console.log("User is now AFK");
            }, 120000); 
        }

        window.addEventListener('mousemove', resetAFK);
        window.addEventListener('keydown', resetAFK);
        window.addEventListener('mousedown', resetAFK);
        window.addEventListener('touchstart', resetAFK);
        
        // Start the timer immediately
        resetAFK();

        // --- Ping Request to the Server ---
        setInterval(() => {
            // Replace "Spielt BrickBreaker" with the actual activity for each page
            let currentActivity = "Spielt Speedtyping"; 
            
            fetch('/api/ping', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                // We now send the isAFK flag to the server!
                body: JSON.stringify({ activity: currentActivity, is_afk: isAFK }) 
            }).catch(e => console.log(e));
        }, 5000);
    </script>
</body>
</html>
