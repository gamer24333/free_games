<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Klassen-Flappy</title>
    <style>
        /* Grunddesign und Kontrastbereiche oben/unten */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #222;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Oberer Header-Bereich */
        .header-bar {
            background-color: #161616;
            padding: 10px;
            text-align: center;
            border-bottom: 2px solid #2d2d2d;
            box-sizing: border-box;
            z-index: 10;
        }

        /* Hauptbereich nach oben verschoben */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 30px;
            padding: 20px;
            box-sizing: border-box;
            flex-wrap: wrap;
            overflow-y: auto;
        }

        /* Unterer Footer-Bereich */
        .footer-bar {
            background-color: #161616;
            padding: 12px 10px;
            text-align: center;
            border-top: 2px solid #2d2d2d;
            font-size: 14px;
            color: #ccc;
            box-sizing: border-box;
            z-index: 10;
        }

        h1 {
            margin: 0;
            font-size: 22px;
            color: #f9d423;
            display: inline-block;
            vertical-align: middle;
        }

        /* Buttons */
        .btn { display: inline-block; padding: 8px 16px; background: #555; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; border: none; cursor: pointer; font-size: 14px; }
        .btn:hover { background: #444; }
        .btn-back { float: left; }

        /* Dezenter, kleiner Vollbild-Link direkt beim Spiel */
        .fullscreen-link {
            color: #ff9f43;
            text-decoration: underline;
            cursor: pointer;
            font-weight: bold;
            margin-left: 10px;
        }
        .fullscreen-link:hover {
            color: #e08b35;
        }

        /* Das Canvas (Spielfeld) */
        #flappyCanvas {
            border: 4px solid #f9d423;
            border-radius: 8px;
            background: #70c5ce;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            display: block;
            transition: all 0.2s ease;
        }

        /* Spezifisches Verhalten für das Canvas im Vollbildmodus */
        #flappyCanvas:fullscreen {
            width: auto;
            height: 100vh;
            border: none;
            border-radius: 0;
            background: #70c5ce;
        }
        #flappyCanvas:-webkit-full-screen { width: auto; height: 100vh; border: none; border-radius: 0; }

        /* Rangliste */
        .leaderboard-box {
            background: #333;
            border: 2px solid #444;
            border-radius: 12px;
            width: 280px;
            padding: 20px;
            box-sizing: border-box;
            text-align: left;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .leaderboard-table th, .leaderboard-table td { padding: 6px 8px; border-bottom: 1px solid #444; text-align: left; font-size: 14px; }
        .leaderboard-table th { color: #f9d423; }
        .leaderboard-table tr:nth-child(1) td { color: #ffd700; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header-bar">
        <a href="/games" class="btn btn-back">⬅️ Zurück</a>
        <h1>🐦 Klassen-Flappy</h1>
    </div>

    <div class="main-content">
        <canvas id="flappyCanvas" width="320" height="480"></canvas>

        <div class="leaderboard-box">
            <h3 style="margin-top: 0; color: #f9d423; text-align: center; margin-bottom: 5px;">🏆 Flappy-Rangliste</h3>
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th>Platz</th>
                        <th>Name</th>
                        <th>Highscore</th>
                    </tr>
                </thead>
                <tbody>
                    {% for player, score in leaderboard %}
                    <tr>
                        <td>{{ loop.index }}.</td>
                        <td>{{ player }}</td>
                        <td>{{ score }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <div class="footer-bar">
        <span>Drücke die <b>Leertaste</b>, <b>Enter</b> oder klicke ins Feld zum Springen! 🚀 
        <span id="fullscreenLink" class="fullscreen-link">[📺 Vollbildmodus]</span></span>
    </div>

    <script>
        const canvas = document.getElementById('flappyCanvas');
        const ctx = canvas.getContext('2d');
        const fullscreenLink = document.getElementById('fullscreenLink');

        // --- AUDIO DATEIEN LADEN ---
        // Die Pfade können angepasst werden, falls deine Dateien anders heißen!
        const bgMusic = new Audio('/static/flappy_bird.mp3');
        bgMusic.loop = true; // Musik soll sich wiederholen
        bgMusic.volume = 0.4; // Lautstärke einstellen (0.0 bis 1.0)
        
        // --- VOLLBILD NUR FÜR DAS SPIELFELD ---
        fullscreenLink.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                if (canvas.requestFullscreen) {
                    canvas.requestFullscreen();
                } else if (canvas.mozRequestFullScreen) {
                    canvas.mozRequestFullScreen();
                } else if (canvas.webkitRequestFullscreen) {
                    canvas.webkitRequestFullscreen();
                } else if (canvas.msRequestFullscreen) {
                    canvas.msRequestFullscreen();
                }
                fullscreenLink.textContent = "[📺 Vollbild beenden]";
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
                fullscreenLink.textContent = "[📺 Vollbildmodus]";
            }
        });

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                fullscreenLink.textContent = "[📺 Vollbildmodus]";
            }
        });

        // --- SPIELVARIABLEN ---
        let birdY = 200;
        let birdVelocity = 0;
        const gravity = 0.4;
        const jump = -6.5;
        let score = 0;
        let gameActive = false;
        let gameOver = false;

        // Rohre
        let pipes = [];
        const pipeWidth = 52;
        const pipeGap = 90; // Schwieriger Original-Abstand
        let frameCount = 0;

        // Grafiken zeichnen
        function draw() {
            // Hintergrund-Himmel
            ctx.fillStyle = '#70c5ce';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Wolken/Boden
            ctx.fillStyle = '#ded895';
            ctx.fillRect(0, canvas.height - 50, canvas.width, 50);
            ctx.fillStyle = '#73bf2e';
            ctx.fillRect(0, canvas.height - 58, canvas.width, 8);

            // Rohre zeichnen
            pipes.forEach(pipe => {
                ctx.fillStyle = '#73bf2e';
                ctx.strokeStyle = '#55801a';
                ctx.lineWidth = 3;

                // Oberes Rohr
                ctx.fillRect(pipe.x, 0, pipeWidth, pipe.top);
                ctx.strokeRect(pipe.x, 0, pipeWidth, pipe.top);

                // Unteres Rohr
                ctx.fillRect(pipe.x, canvas.height - pipe.bottom, pipeWidth, pipe.bottom);
                ctx.strokeRect(pipe.x, canvas.height - pipe.bottom, pipeWidth, pipe.bottom);
            });

            // Vogel zeichnen
            ctx.fillStyle = '#f9d423';
            ctx.beginPath();
            ctx.arc(60, birdY, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Auge
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(64, birdY - 4, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(65, birdY - 4, 1.5, 0, Math.PI * 2);
            ctx.fill();

            // Schnabel
            ctx.fillStyle = '#ff9f43';
            ctx.beginPath();
            ctx.moveTo(70, birdY - 2);
            ctx.lineTo(80, birdY + 1);
            ctx.lineTo(70, birdY + 4);
            ctx.closePath();
            ctx.fill();

            // Score-Anzeige
            ctx.fillStyle = 'white';
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 4;
            ctx.font = 'bold 32px Arial';
            ctx.textAlign = 'center';
            ctx.strokeText(score, canvas.width / 2, 50);
            ctx.fillText(score, canvas.width / 2, 50);

            if (!gameActive && !gameOver) {
                ctx.font = 'bold 18px Arial';
                ctx.strokeText("Klicke zum Starten!", canvas.width / 2, canvas.height / 2);
                ctx.fillText("Klicke zum Starten!", canvas.width / 2, canvas.height / 2);
            }

            if (gameOver) {
                ctx.font = 'bold 24px Arial';
                ctx.fillStyle = '#ff2e63';
                ctx.strokeText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);
                
                ctx.font = 'bold 16px Arial';
                ctx.fillStyle = 'white';
                ctx.strokeText("Klicke für Neustart", canvas.width / 2, canvas.height / 2 + 20);
                ctx.fillText("Klicke für Neustart", canvas.width / 2, canvas.height / 2 + 20);
            }
        }

        function update() {
            if (gameActive && !gameOver) {
                birdVelocity += gravity;
                birdY += birdVelocity;

                if (birdY + 12 >= canvas.height - 58 || birdY - 12 <= 0) {
                    triggerGameOver();
                }

                frameCount++;
                if (frameCount % 100 === 0) {
                    const topLimit = 50;
                    const bottomLimit = canvas.height - 58 - pipeGap - 50;
                    const topHeight = Math.floor(Math.random() * (bottomLimit - topLimit)) + topLimit;
                    const bottomHeight = canvas.height - 58 - pipeGap - topHeight;

                    pipes.push({
                        x: canvas.width,
                        top: topHeight,
                        bottom: bottomHeight,
                        passed: false
                    });
                }

                pipes.forEach(pipe => {
                    pipe.x -= 2;

                    if (60 + 12 > pipe.x && 60 - 12 < pipe.x + pipeWidth) {
                        if (birdY - 12 < pipe.top || birdY + 12 > canvas.height - pipe.bottom) {
                            triggerGameOver();
                        }
                    }

                    if (!pipe.passed && pipe.x + pipeWidth < 60) {
                        score++;
                        pipe.passed = true;
                    }
                });

                pipes = pipes.filter(pipe => pipe.x + pipeWidth > 0);
            }
        }

        function triggerGameOver() {
            gameOver = true;
            gameActive = false;
            
            // Musik stoppen und Crash abspielen
            bgMusic.pause();
            bgMusic.currentTime = 0;
            

            submitScore(score);
        }

        function resetGame() {
            birdY = 200;
            birdVelocity = 0;
            score = 0;
            pipes = [];
            frameCount = 0;
            gameOver = false;
            gameActive = true;

            // Musik von vorne starten
            bgMusic.play().catch(e => console.log("Audio-Autoplay verhindert:", e));
        }

        function action() {
            if (gameOver) {
                resetGame();
            } else if (!gameActive) {
                gameActive = true;
                bgMusic.play().catch(e => console.log("Audio-Autoplay verhindert:", e));
            } else {
                birdVelocity = jump;
                // Ton abspielen (zurücksetzen, falls er noch läuft)
                
            }
        }

        // --- CONTROLS ---
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') {
                e.preventDefault();
                action();
            }
        });

        canvas.addEventListener('mousedown', (e) => {
            e.preventDefault();
            action();
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            action();
        }, { passive: false });

        async function submitScore(finalScore) {
            try {
                const response = await fetch('/api/submit-flappy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ score: finalScore })
                });
                if (response.ok) {
                    setTimeout(() => {
                        window.location.reload();
                    }, 1500);
                }
            } catch (e) {
                console.error("Score-Übertragungsfehler:", e);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
