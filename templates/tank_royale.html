<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tank Royale & Rangliste</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .game-layout { display: flex; justify-content: center; gap: 20px; max-width: 1100px; margin: 0 auto; padding: 10px; }
        canvas { background-color: #111; border: 4px solid #ff9f43; border-radius: 8px; }
        .controls-box { margin-top: 10px; background: #1e1e1e; padding: 15px; border-radius: 8px; border: 1px solid #333; }
        .controls-box label { margin-right: 15px; color: #fff; }
        .controls-box input { background: #2d2d2d; color: #fff; border: 1px solid #555; padding: 5px; border-radius: 4px; width: 60px; }
        .btn-fire { background: #ff2e63; color: white; padding: 6px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-fire:hover { background: #ff0044; }
        .leaderboard-box { background: #1e1e1e; border: 2px solid #333; border-radius: 8px; width: 250px; padding: 15px; text-align: left; }
        .leaderboard-table { width: 100%; border-collapse: collapse; }
        .leaderboard-table th, .leaderboard-table td { padding: 8px; border-bottom: 1px solid #333; }
        .leaderboard-table tr:nth-child(2) td { color: #ffd700; font-weight: bold; }
    </style>
</head>
<body>
    <a href="/games" class="btn btn-back">⬅️ Zurück zu den Spielen</a>
    <h1>🚀 Tank Royale (vs. Bot)</h1>

    <div class="game-layout">
        <div>
            <canvas id="tankCanvas" width="750" height="400"></canvas>
            
            <div class="controls-box">
                <label>📐 Winkel (0-90°): <input type="number" id="angleInput" value="45" min="0" max="90"></label>
                <label>💥 Kraft (1-20): <input type="number" id="powerInput" value="12" min="1" max="20"></label>
                <button class="btn-fire" id="fireBtn">FEUER! 🔥</button>
            </div>
            <p style="color: #aaa; font-size: 14px; margin-top: 5px;">Zerstöre den gegnerischen Bot! Jeder Treffer bringt Punkte. Wenn du stirbst, wird dein Highscore gespeichert.</p>
        </div>
        
        <div class="leaderboard-box">
            <h3>🏆 Klassen-Rangliste</h3>
            <table class="leaderboard-table">
                <thead>
                    <tr><th>Platz</th><th>Name</th><th>Score</th></tr>
                </thead>
                <tbody>
                    {% for player, score in leaderboard %}
                    <tr>
                        <td>{{ loop.index }}</td>
                        <td>{{ player }}</td>
                        <td>{{ score or 0 }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/tank_royale.js') }}"></script>
</body>
</html>
