<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Class-Slither Arena</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #111; color: white; font-family: Arial, sans-serif; touch-action: none; /* WICHTIG FÜR IPAD: Verhindert Scrollen */ }
        canvas { display: block; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #leaderboard { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 10px; border: 1px solid #555; pointer-events: none; }
        #leaderboard h3 { margin: 0 0 10px 0; color: #2ecc71; text-align: center; }
        
        #score-display { position: absolute; bottom: 20px; left: 20px; font-size: 24px; font-weight: bold; background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 30px; pointer-events: none; }
        
        /* Neuer Boost Button für iPad/Handy */
        #mobile-boost { position: absolute; bottom: 30px; right: 30px; width: 80px; height: 80px; background: rgba(255, 46, 99, 0.8); border-radius: 50%; border: 3px solid #ff2e63; color: white; font-weight: bold; font-size: 14px; display: flex; justify-content: center; align-items: center; pointer-events: all; user-select: none; box-shadow: 0 0 15px #ff2e63; cursor: pointer; }
        #mobile-boost:active { background: #ff2e63; transform: scale(0.95); }

        #death-screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; flex-direction: column; pointer-events: all; }
        .btn { padding: 15px 30px; background: #00adb5; color: white; text-decoration: none; border-radius: 8px; font-size: 20px; border: none; cursor: pointer; font-weight: bold; margin-top: 20px; }
        .btn:hover { background: #007c82; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div id="leaderboard">
            <h3>🏆 Top 5</h3>
            <div id="lb-list"></div>
        </div>
        <div id="score-display">Punkte: <span id="my-score">0</span></div>
        <div id="mobile-boost">⚡ BOOST</div>
    </div>

    <div id="death-screen">
        <h1 style="color: #ff2e63; font-size: 50px; margin: 0;">Du wurdest gefressen! 💀</h1>
        <p style="font-size: 24px;">Dein Score: <span id="final-score">0</span></p>
        <button class="btn" onclick="location.reload()">Neuer Versuch</button>
        <a href="/slither" style="color: #aaa; margin-top: 15px; text-decoration: none;">Zurück ins Menü</a>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Responsive Zoom-Faktor für Handys/Tablets (verhindert, dass die Map zu kompakt wirkt)
        const isMobile = window.innerWidth < 900;
        const zoom = isMobile ? Math.max(0.55, window.innerWidth / 1100) : 1.0;

        const myName = "{{ me }}";
        const mapSize = 3000;
        
        const colors = ["#ff2e63", "#00adb5", "#2ecc71", "#f1c40f", "#9b59b6", "#e67e22"];
        const myColor = colors[Math.floor(Math.random() * colors.length)];

        let myBody = [[Math.random() * (mapSize - 400) + 200, Math.random() * (mapSize - 400) + 200]];
        let myScore = 10;
        let myAngle = 0;
        let isDead = false;
        
        // --- STEUERUNG (MAUS & TOUCH & WASD) ---
        let targetAngle = 0;
        let isBoosting = false;
        let keys = {w: false, a: false, s: false, d: false};

        // 1. Maus (berücksichtigt den Zoom)
        window.addEventListener('mousemove', (e) => {
            if(Object.values(keys).includes(true)) return; // WASD hat Vorrang
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            targetAngle = Math.atan2((e.clientY - centerY) / zoom, (e.clientX - centerX) / zoom);
        });

        // 2. Touch (iPad / Handy - berücksichtigt den Zoom)
        canvas.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            targetAngle = Math.atan2((touch.clientY - canvas.height/2) / zoom, (touch.clientX - canvas.width/2) / zoom);
        }, {passive: false});

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault(); // Stoppt das Scrollen auf Touch-Geräten
            const touch = e.touches[0];
            targetAngle = Math.atan2((touch.clientY - canvas.height/2) / zoom, (touch.clientX - canvas.width/2) / zoom);
        }, {passive: false});

        // 3. Tastatur (WASD + Boost auf E oder Leertaste)
        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if(k === 'w' || k === 'arrowup') keys.w = true;
            if(k === 'a' || k === 'arrowleft') keys.a = true;
            if(k === 's' || k === 'arrowdown') keys.s = true;
            if(k === 'd' || k === 'arrowright') keys.d = true;
            if(k === 'e' || k === ' ') isBoosting = true;
        });
        window.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if(k === 'w' || k === 'arrowup') keys.w = false;
            if(k === 'a' || k === 'arrowleft') keys.a = false;
            if(k === 's' || k === 'arrowdown') keys.s = false;
            if(k === 'd' || k === 'arrowright') keys.d = false;
            if(k === 'e' || k === ' ') isBoosting = false;
        });

        // 4. Boost Button (Touch & Klick)
        const boostBtn = document.getElementById('mobile-boost');
        boostBtn.addEventListener('mousedown', () => isBoosting = true);
        boostBtn.addEventListener('mouseup', () => isBoosting = false);
        boostBtn.addEventListener('touchstart', (e) => { e.preventDefault(); isBoosting = true; });
        boostBtn.addEventListener('touchend', (e) => { e.preventDefault(); isBoosting = false; });

        let otherPlayers = {};
        let bots = {};
        let foods = {};
        let leaderboard = [];
        let newlyEatenFood = [];
        let boostCostTracker = 0;

        function getRadius(score) { return 10 + (score / 20); }

        function updateLocal() {
            if (isDead) return;

            // WASD Winkel berechnen
            let dx = 0, dy = 0;
            if (keys.w) dy -= 1; if (keys.s) dy += 1;
            if (keys.a) dx -= 1; if (keys.d) dx += 1;
            if (dx !== 0 || dy !== 0) targetAngle = Math.atan2(dy, dx);

            // Bewegung glätten (FPS-unabhängig durch feste Zeiteinheit)
            let angleDiff = targetAngle - myAngle;
            while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
            while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
            myAngle += angleDiff * 0.25;

            // --- FPS-UNABHÄNGIGE GESCHWINDIGKEIT ---
            let speed = 250 + (4000 / (myScore + 100)); // Pixel pro Sekunde
            if (isBoosting && myScore > 15) {
                speed *= 1.8; 
                boostCostTracker += 0.3; 
                if (boostCostTracker >= 1) {
                    myScore -= 1; // Kostet Punkte
                    boostCostTracker -= 1;
                }
            }
            
            // Bewegung pro Frame basierend auf festem Timestep (1/60 Sekunde)
            const stepDist = speed * (1 / 60);

            const head = myBody[0];
            let newX = head[0] + Math.cos(myAngle) * stepDist;
            let newY = head[1] + Math.sin(myAngle) * stepDist;

            if (newX < 0) newX = 0; if (newX > mapSize) newX = mapSize;
            if (newY < 0) newY = 0; if (newY > mapSize) newY = mapSize;

            myBody.unshift([newX, newY]); 

            const targetLength = Math.floor(myScore / 5) + 5;
            while (myBody.length > targetLength) myBody.pop();

            const myRadius = getRadius(myScore);
            for (let [fid, f] of Object.entries(foods)) {
                if (Math.hypot(newX - f.x, newY - f.y) < myRadius + (f.v === 5 ? 10 : 5)) {
                    myScore += f.v;
                    newlyEatenFood.push(fid);
                    delete foods[fid]; 
                }
            }

            let killedBy = null;
            const checkCollision = (entities) => {
                for (let [name, data] of Object.entries(entities)) {
                    if (!data.body || data.body.length === 0) continue;
                    const enemyRadius = getRadius(data.score);
                    for (let i = 0; i < data.body.length; i++) {
                        if (Math.hypot(newX - data.body[i][0], newY - data.body[i][1]) < (myRadius + enemyRadius) * 0.7) {
                            killedBy = name; break;
                        }
                    }
                    if (killedBy) break;
                }
            };
            
            checkCollision(otherPlayers);
            if (!killedBy) checkCollision(bots);

            if (killedBy) {
                isDead = true;
                syncServer(true); 
                document.getElementById('death-screen').style.display = "flex";
                document.getElementById('final-score').innerText = myScore;
            }
        }

        function drawGame() {
            if (isDead) return;

            // Kamera-Berechnung unter Berücksichtigung des Zoom-Faktors
            const viewWidth = canvas.width / zoom;
            const viewHeight = canvas.height / zoom;
            const camX = myBody[0][0] - viewWidth / 2;
            const camY = myBody[0][1] - viewHeight / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.scale(zoom, zoom); // Wendet den Handy-/Desktop-Zoom an
            ctx.translate(-camX, -camY);

            ctx.strokeStyle = "#222"; ctx.lineWidth = 2;
            for(let x=0; x<=mapSize; x+=100) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,mapSize); ctx.stroke(); }
            for(let y=0; y<=mapSize; y+=100) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(mapSize,y); ctx.stroke(); }
            ctx.strokeStyle = "#ff2e63"; ctx.strokeRect(0, 0, mapSize, mapSize); 

            for (let [fid, f] of Object.entries(foods)) {
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.v === 5 ? 10 : 5, 0, Math.PI * 2);
                ctx.fillStyle = f.c;
                ctx.fill();
                ctx.shadowBlur = 10; ctx.shadowColor = f.c;
            }
            ctx.shadowBlur = 0;

            const drawSnake = (body, color, name, score) => {
                if(!body || body.length === 0) return;
                const r = getRadius(score);
                
                ctx.lineWidth = r * 2;
                ctx.lineCap = "round";
                ctx.lineJoin = "round";
                ctx.strokeStyle = color;
                
                if(name === myName && isBoosting && score > 15) { ctx.shadowBlur = 15; ctx.shadowColor = color; }
                
                ctx.beginPath();
                ctx.moveTo(body[0][0], body[0][1]);
                for (let i = 1; i < body.length; i++) ctx.lineTo(body[i][0], body[i][1]);
                ctx.stroke();
                ctx.shadowBlur = 0;

                // Augen rendern
                let headAng = 0;
                if(body.length > 1) headAng = Math.atan2(body[0][1] - body[1][1], body[0][0] - body[1][0]);
                
                const eyeDist = r * 0.6; const eyeR = r * 0.3;
                const rightEyeX = body[0][0] + Math.cos(headAng + 0.8) * eyeDist;
                const rightEyeY = body[0][1] + Math.sin(headAng + 0.8) * eyeDist;
                const leftEyeX = body[0][0] + Math.cos(headAng - 0.8) * eyeDist;
                const leftEyeY = body[0][1] + Math.sin(headAng - 0.8) * eyeDist;

                ctx.fillStyle = "white"; 
                ctx.beginPath(); ctx.arc(rightEyeX, rightEyeY, eyeR, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(leftEyeX, leftEyeY, eyeR, 0, Math.PI*2); ctx.fill();
                
                ctx.fillStyle = "black"; 
                ctx.beginPath(); ctx.arc(rightEyeX + Math.cos(headAng)*eyeR*0.4, rightEyeY + Math.sin(headAng)*eyeR*0.4, eyeR*0.5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(leftEyeX + Math.cos(headAng)*eyeR*0.4, leftEyeY + Math.sin(headAng)*eyeR*0.4, eyeR*0.5, 0, Math.PI*2); ctx.fill();

                // Name
                ctx.fillStyle = "white";
                ctx.font = "14px Arial";
                ctx.textAlign = "center";
                ctx.fillText(name, body[0][0], body[0][1] - r - 15);

                // Krone für Platz 1
                if (leaderboard.length > 0 && leaderboard[0][0] === name) {
                    ctx.font = "24px Arial";
                    ctx.fillText("👑", body[0][0], body[0][1] - r - 30);
                }
            };

            for (let [p, d] of Object.entries(otherPlayers)) drawSnake(d.body, d.color, p, d.score);
            for (let [b, d] of Object.entries(bots)) drawSnake(d.body, d.color, b, d.score);
            drawSnake(myBody, myColor, myName, myScore);

            ctx.restore();

            document.getElementById('my-score').innerText = myScore;
            
            let lbHtml = "";
            leaderboard.forEach((item, index) => {
                const isMe = item[0] === myName ? 'style="color:#00adb5; font-weight:bold;"' : '';
                lbHtml += `<div ${isMe}>${index+1}. ${item[0]} ${index===0 ? '👑' : ''} - ${item[1]}</div>`;
            });
            document.getElementById('lb-list').innerHTML = lbHtml;
        }

        async function syncServer(sendingDeath = false) {
            try {
                const res = await fetch('/api/slither/sync', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ body: myBody, color: myColor, score: myScore, eaten: newlyEatenFood, is_dead: sendingDeath })
                });
                newlyEatenFood = []; 
                if(res.ok && !sendingDeath) {
                    const data = await res.json();
                    otherPlayers = data.players; bots = data.bots; foods = data.food; leaderboard = data.leaderboard;
                }
            } catch (e) { console.log(e); }
        }

        // --- DER PERFEKTE FPS-UNABHÄNGIGE GAME-LOOP (AKKUMULATOR-MUSTER) ---
        let lastTime = performance.now();
        let timeAccumulator = 0;
        const STEP_TIME = 1 / 60; // Feste 60 Updates pro Sekunde

        function gameLoop(timestamp) {
            if (!timestamp) timestamp = performance.now();
            let dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            if (dt > 0.25) dt = 0.25; // Tab-Wechsel-Schutz
            timeAccumulator += dt;

            // Physik/Logik läuft exakt im 60-Hz-Takt – völlig egal, ob der Bildschirm 60 oder 120 Hz hat!
            while (timeAccumulator >= STEP_TIME) {
                updateLocal();
                timeAccumulator -= STEP_TIME;
            }

            // Rendern läuft butterweich mit der maximalen Monitor-Bildrate
            drawGame();

            if (!isDead) {
                requestAnimationFrame(gameLoop);
            }
        }

        setInterval(() => { if(!isDead) syncServer(false); }, 100);
        window.addEventListener('resize', () => { 
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
        });

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
