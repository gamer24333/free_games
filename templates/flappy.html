<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🦘 Flappy Bird Klassen-Turnier</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #222; color: white; margin-top: 30px; }
        .game-container { display: flex; justify-content: center; align-items: flex-start; gap: 30px; max-width: 900px; margin: 0 auto; padding: 10px; flex-wrap: wrap; }
        canvas { background: #70c5ce; border: 4px solid #333; border-radius: 8px; display: block; max-width: 100%; }
        .leaderboard { background: #333; border: 2px solid #444; border-radius: 12px; padding: 20px; width: 280px; text-align: left; }
        .leaderboard th, .leaderboard td { padding: 8px; text-align: left; border-bottom: 1px solid #444; }
        .leaderboard th { color: #e67e22; }
        .btn-pause { background: #e67e22; margin-top: 10px; padding: 10px 20px; color: white; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <a href="/games" class="btn" style="background: #555; margin-bottom: 20px;">⬅️ Zurück zu den Spielen</a>
    <h1>🦘 Flappy Bird</h1>
    <p style="color: #aaa; margin-top: 0;">Leertaste zum Springen | <b>ESC</b> oder Button zum Pausieren!</p>

    <div class="game-container">
        <div>
            <canvas id="flappyCanvas" width="320" height="480"></canvas>
            <button id="pauseBtn" class="btn-pause" style="display: none;">⏸️ Pause</button>
        </div>

        <div class="leaderboard">
            <h3 style="margin-top:0; color:#e67e22; text-align:center;">🏆 Highscores</h3>
            <table style="width:100%; border-collapse:collapse;">
                <thead>
                    <tr><th>Platz</th><th>Name</th><th>Rohre</th></tr>
                </thead>
                <tbody>
                    {% for player, score in leaderboard %}
                    <tr>
                        <td>{{ loop.index }}.</td>
                        <td>{{ player }}</td>
                        <td><b>{{ score }}</b></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>


    <audio id="gdMusic" loop hidden>
        <source src="{{ url_for('static', filename='flappy_bird.mp3') }}" type="audio/mpeg">
    </audio>
    
    <script>
        const canvas = document.getElementById('flappyCanvas');
const ctx = canvas.getContext('2d');
const pauseBtn = document.getElementById('pauseBtn');
const bgMusic = document.getElementById('gdMusic');

let birdY = 200, velocity = 0, gravity = 0.25, jump = -4.6;
let score = 0, gameOver = false, gameStarted = false;
let isPaused = false;
let isSaving = false; // NEU: Verhindert Mehrfach-Übertragungen
let pipes = [];

function doJump() {
    if (isPaused) return;
    if (gameOver) { resetGame(); return; }
    if (!gameStarted) {
        gameStarted = true;
        pauseBtn.style.display = "inline-block";
        bgMusic.currentTime = 0;
        bgMusic.play().catch(e => console.log("Autoplay blockiert:", e));
    }
    velocity = jump;
}

function togglePause() {
    if (!gameStarted || gameOver) return;
    isPaused = !isPaused;
    pauseBtn.textContent = isPaused ? "▶️ Weiter" : "⏸️ Pause";
    
    if (isPaused) {
        bgMusic.pause();
    } else {
        bgMusic.play().catch(e => console.log(e));
    }
}

window.addEventListener('keydown', (e) => { 
    if(e.code === 'Space') { e.preventDefault(); doJump(); } 
    if(e.code === 'Escape') { e.preventDefault(); togglePause(); }
});
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); doJump(); });
canvas.addEventListener('mousedown', doJump);
pauseBtn.addEventListener('click', togglePause);

function resetGame() {
    birdY = 200; velocity = 0; score = 0; gameOver = false; gameStarted = false; isPaused = false; isSaving = false; pipes = [];
    pauseBtn.style.display = "none";
    pauseBtn.textContent = "⏸️ Pause";
    bgMusic.pause();
}

async function sendScore(finalScore) {
    if (isSaving) return; // Wenn bereits gespeichert wird, brich hier ab!
    isSaving = true;
    
    bgMusic.pause();
    try {
        await fetch('/api/submit-flappy', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ score: finalScore })
        });
        // Nach erfolgreichem Speichern kurz warten, dann Seite für die Rangliste neu laden
        setTimeout(() => { window.location.reload(); }, 800);
    } catch(e) { 
        console.error(e); 
        isSaving = false; // Bei Fehler Zurücksetzen, damit man es nochmal versuchen kann
    }
}

function gameLoop() {
    ctx.fillStyle = '#70c5ce';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (gameStarted && !gameOver && !isPaused) {
        velocity += gravity;
        birdY += velocity;

        if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 160) {
            let gap = 110;
            let topHeight = Math.floor(Math.random() * (canvas.height - gap - 100)) + 30;
            pipes.push({ x: canvas.width, top: topHeight, bottom: canvas.height - topHeight - gap, passed: false });
        }

        pipes.forEach(pipe => {
            pipe.x -= 2;

            if (!pipe.passed && pipe.x < 50) {
                score++;
                pipe.passed = true;
            }

            if (50 + 20 > pipe.x && 50 < pipe.x + 52) {
                if (birdY < pipe.top || birdY + 20 > canvas.height - pipe.bottom) {
                    gameOver = true;
                    sendScore(score);
                }
            }
        });
        pipes = pipes.filter(p => p.x > -60);
    }

    pipes.forEach(pipe => {
        ctx.fillStyle = '#73bf2e';
        ctx.fillRect(pipe.x, 0, 52, pipe.top);
        ctx.fillRect(pipe.x, canvas.height - pipe.bottom, 52, pipe.bottom);
    });

    if (birdY + 20 > canvas.height || birdY < 0) {
        if (!gameOver && gameStarted && !isPaused) { 
            gameOver = true; 
            sendScore(score); 
        }
    }

    ctx.fillStyle = '#f1c40f';
    ctx.fillRect(50, birdY, 20, 20);

    ctx.fillStyle = 'white';
    ctx.font = 'bold 24px Arial';
    ctx.fillText(score, canvas.width / 2 - 10, 40);

    if (!gameStarted && !gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = 'white';
        ctx.font = '18px Arial';
        ctx.fillText('Klicken zum Starten', canvas.width/2 - 75, canvas.height/2);
    }
    
    if (isPaused) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#e67e22';
        ctx.font = 'bold 28px Arial';
        ctx.fillText('PAUSIERT', canvas.width / 2 - 70, canvas.height / 2);
        ctx.fillStyle = 'white';
        ctx.font = '14px Arial';
        ctx.fillText('ESC oder Button zum Weiterspielen', canvas.width / 2 - 110, canvas.height / 2 + 30);
    }

    if (gameOver) {
        ctx.fillStyle = 'rgba(255,0,0,0.3)';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = 'white';
        ctx.fillText('Game Over! Speichere...', canvas.width/2 - 100, canvas.height/2);
    }

    requestAnimationFrame(gameLoop);
}
gameLoop();
    </script>
    
</body>
</html>
