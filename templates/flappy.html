<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🦘 Flappy Bird Klassen-Turnier</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #222; color: white; margin-top: 30px; }
        .game-container { display: flex; justify-content: center; align-items: flex-start; gap: 30px; max-width: 900px; margin: 0 auto; padding: 10px; flex-wrap: wrap; }
        
        /* Neuer Wrapper für das Spiel */
        .game-wrapper { 
            position: relative; 
            background: #70c5ce; 
            border: 4px solid #333; 
            border-radius: 8px; 
            display: inline-block;
        }
        canvas { display: block; max-width: 100%; background: #70c5ce; }
        
        .leaderboard { background: #333; border: 2px solid #444; border-radius: 12px; padding: 20px; width: 280px; text-align: left; }
        .leaderboard th, .leaderboard td { padding: 8px; text-align: left; border-bottom: 1px solid #444; }
        .leaderboard th { color: #e67e22; }
        .btn-pause { background: #e67e22; margin-top: 10px; padding: 10px 20px; color: white; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; }
        
        /* Neuer Vollbild-Button */
        .fullscreen-toggle-btn {
            background: #eccc68;
            color: #222;
            border: none;
            padding: 8px 15px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        /* --- STYLING FÜR ECHTEN VOLLBILDMODUS --- */
        .game-wrapper:fullscreen {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #111;
            border: none;
        }
        .game-wrapper:fullscreen canvas {
            height: 85vh; /* Macht den Canvas extrem groß */
            width: auto;
            border: 4px solid #333;
            border-radius: 8px;
        }
        .game-wrapper:fullscreen .fullscreen-toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #ff2e63;
            color: white;
            font-size: 16px;
            padding: 12px 24px;
            z-index: 99999;
        }
        .game-wrapper:fullscreen #pauseBtn {
            position: absolute;
            bottom: 20px;
            z-index: 99999;
        }
    </style>
</head>
<body>

    <a href="/games" class="btn" style="background: #555; margin-bottom: 20px;">⬅️ Zurück zu den Spielen</a>
    <h1>🦘 Flappy Bird</h1>
    <p style="color: #aaa; margin-top: 0;">Leertaste zum Springen | <b>ESC</b> oder Button zum Pausieren!</p>

    <div class="game-container">
        <div id="flappyWrapper" class="game-wrapper">
            <button id="fullscreenBtn" class="fullscreen-toggle-btn" onclick="toggleFullscreen()">📺 Vollbildmodus</button>
            <canvas id="flappyCanvas" width="320" height="480"></canvas>
            <button id="pauseBtn" class="btn-pause" style="display: none;">⏸️ Pause</button>
        </div>

        <div class="leaderboard">
            <h3 style="margin-top:0; color:#e67e22; text-align:center;">🏆 Highscores</h3>
            <table style="width:100%; border-collapse:collapse;">
                <thead>
                    <tr><th>Platz</th><th>Name</th><th>Rohre</th></tr>
                </thead>
                <tbody>
                    {% for player, score in leaderboard %}
                    <tr>
                        <td>{{ loop.index }}.</td>
                        <td>{{ player }}</td>
                        <td><b>{{ score }}</b></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>


    <audio id="gdMusic" loop hidden>
        <source src="{{ url_for('static', filename='flappy_bird.mp3') }}" type="audio/mpeg">
    </audio>
    
    <script>
        const canvas = document.getElementById('flappyCanvas');
        const ctx = canvas.getContext('2d');
        const pauseBtn = document.getElementById('pauseBtn');
        const bgMusic = document.getElementById('gdMusic');
        const wrapper = document.getElementById('flappyWrapper');
        const fsBtn = document.getElementById('fullscreenBtn');

        let birdY = 200, velocity = 0, gravity = 0.25, jump = -4.6;
        let score = 0, gameOver = false, gameStarted = false;
        let isPaused = false;
        let isSaving = false; 
        let pipes = [];

        // --- VOLLBILD FUNKTION ---
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                wrapper.requestFullscreen().catch(err => {
                    console.error("Fehler beim Aktivieren des Vollbildmodus:", err.message);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // Überwacht Statusänderungen (z.B. wenn man mit ESC das Vollbild verlässt)
        document.addEventListener("fullscreenchange", () => {
            if (document.fullscreenElement) {
                fsBtn.textContent = "❌ Vollbild beenden";
            } else {
                fsBtn.textContent = "📺 Vollbildmodus";
            }
        });

        function doJump() {
            if (isPaused) return;
            if (gameOver) { resetGame(); return; }
            if (!gameStarted) {
                gameStarted = true;
                pauseBtn.style.display = "inline-block";
                bgMusic.currentTime = 0;
                bgMusic.play().catch(e => console.log("Autoplay blockiert:", e));
            }
            velocity = jump;
        }

        function togglePause() {
            if (!gameStarted || gameOver) return;
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? "▶️ Weiter" : "⏸️ Pause";
            
            if (isPaused) {
                bgMusic.pause();
            } else {
                bgMusic.play().catch(e => console.log(e));
            }
        }

        window.addEventListener('keydown', (e) => { 
            if(e.code === 'Space') { e.preventDefault(); doJump(); } 
            if(e.code === 'Escape') { e.preventDefault(); togglePause(); }
        });
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); doJump(); });
        canvas.addEventListener('mousedown', doJump);
        pauseBtn.addEventListener('click', togglePause);

        function resetGame() {
            birdY = 200; velocity = 0; score = 0; gameOver = false; gameStarted = false; isPaused = false; isSaving = false; pipes = [];
            pauseBtn.style.display = "none";
            pauseBtn.textContent = "⏸️ Pause";
            bgMusic.pause();
        }

        async function sendScore(finalScore) {
            if (isSaving) return; 
            isSaving = true;
            
            bgMusic.pause();
            try {
                await fetch('/api/submit-flappy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ score: finalScore })
                });
                setTimeout(() => { window.location.reload(); }, 800);
            } catch(e) { 
                console.error(e); 
                isSaving = false; 
            }
        }

        function gameLoop() {
            ctx.fillStyle = '#70c5ce';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (gameStarted && !gameOver && !isPaused) {
                velocity += gravity;
                birdY += velocity;

                if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 160) {
                    let gap = 110; 
                    let minHeight = 30;
                    let maxHeight = canvas.height - gap - 100;
                    let topHeight;

                    if (pipes.length > 0) {
                        let lastTop = pipes[pipes.length - 1].top;
                        let maxChange = 140; 
                        
                        let lowestPossible = Math.max(minHeight, lastTop - maxChange);
                        let highestPossible = Math.min(maxHeight, lastTop + maxChange);
                        
                        topHeight = Math.floor(Math.random() * (highestPossible - lowestPossible + 1)) + lowestPossible;
                    } else {
                        topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
                    }

                    pipes.push({ 
                        x: canvas.width, 
                        top: topHeight, 
                        bottom: canvas.height - topHeight - gap, 
                        passed: false 
                    });
                }

                pipes.forEach(pipe => {
                    pipe.x -= 2;

                    if (!pipe.passed && pipe.x < 50) {
                        score++;
                        pipe.passed = true;
                    }

                    if (50 + 20 > pipe.x && 50 < pipe.x + 52) {
                        if (birdY < pipe.top || birdY + 20 > canvas.height - pipe.bottom) {
                            if (!gameOver) { 
                                gameOver = true;
                                sendScore(score);
                            }
                        }
                    }
                });
                pipes = pipes.filter(p => p.x > -60);
            }

            pipes.forEach(pipe => {
                ctx.fillStyle = '#73bf2e';
                ctx.fillRect(pipe.x, 0, 52, pipe.top);
                ctx.fillRect(pipe.x, canvas.height - pipe.bottom, 52, pipe.bottom);
            });

            if (birdY + 20 > canvas.height || birdY < 0) {
                if (!gameOver) { 
                    gameOver = true; 
                    sendScore(score); 
                }
            }

            ctx.fillStyle = '#f1c40f';
            ctx.fillRect(50, birdY, 20, 20);

            ctx.fillStyle = 'white';
            ctx.font = 'bold 24px Arial';
            ctx.fillText(score, canvas.width / 2 - 10, 40);

            if (!gameStarted && !gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = '18px Arial';
                ctx.fillText('Klicken zum Starten', canvas.width/2 - 75, canvas.height/2);
            }
            
            if (isPaused) {
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#e67e22';
                ctx.font = 'bold 28px Arial';
                ctx.fillText('PAUSIERT', canvas.width / 2 - 70, canvas.height / 2);
                ctx.fillStyle = 'white';
                ctx.font = '14px Arial';
                ctx.fillText('ESC oder Button zum Weiterspielen', canvas.width / 2 - 110, canvas.height / 2 + 30);
            }

            if (gameOver) {
                ctx.fillStyle = 'rgba(255,0,0,0.3)';
                ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle = 'white';
                ctx.fillText('Game Over! Speichere...', canvas.width/2 - 100, canvas.height/2);
            }

            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</body>
</html>
