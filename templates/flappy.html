<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Klassen-Flappy</title>
    <style>
        /* Grunddesign und Kontrastbereiche oben/unten */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #222; /* Hintergrund für den Spielbereich */
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Verhindert Scrollbalken */
        }

        /* Oberer Header-Bereich mit leicht anderer, dunklerer Farbe */
        .header-bar {
            background-color: #161616;
            padding: 15px 10px;
            text-align: center;
            border-bottom: 2px solid #2d2d2d;
            box-sizing: border-box;
            z-index: 10;
        }

        /* Mittlerer Hauptbereich, der das Canvas und die Rangliste hält */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 20px;
            box-sizing: border-box;
            flex-wrap: wrap;
            overflow-y: auto; /* Erlaubt Scrollen auf Handys, falls das Leaderboard lang ist */
        }

        /* Unterer Footer-Bereich mit leicht anderer Farbe */
        .footer-bar {
            background-color: #161616;
            padding: 12px 10px;
            text-align: center;
            border-top: 2px solid #2d2d2d;
            font-size: 14px;
            color: #888;
            box-sizing: border-box;
            z-index: 10;
        }

        h1 {
            margin: 5px 0 0 0;
            font-size: 24px;
            color: #f9d423;
        }

        /* Buttons */
        .btn { display: inline-block; padding: 10px 20px; background: #00adb5; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; }
        .btn:hover { background: #007c82; }
        .btn-back { background: #555; margin-right: 15px; }
        
        .btn-fullscreen { background: #ff9f43; color: black; font-size: 15px; }
        .btn-fullscreen:hover { background: #e08b35; }

        /* Das Canvas (Spielfeld) */
        canvas {
            border: 4px solid #f9d423;
            border-radius: 8px;
            background: #70c5ce; /* Standard Flappy-Himmelblau, falls das Bild lädt */
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            display: block;
        }

        /* Rangliste */
        .leaderboard-box {
            background: #333;
            border: 2px solid #444;
            border-radius: 12px;
            width: 280px;
            padding: 20px;
            box-sizing: border-box;
            text-align: left;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .leaderboard-table th, .leaderboard-table td { padding: 8px; border-bottom: 1px solid #444; text-align: left; }
        .leaderboard-table th { color: #f9d423; }
        .leaderboard-table tr:nth-child(1) td { color: #ffd700; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header-bar">
        <a href="/games" class="btn btn-back">⬅️ Zurück</a>
        <button id="fullscreenBtn" class="btn btn-fullscreen">📺 Vollbildmodus</button>
        <h1>🐦 Klassen-Flappy</h1>
    </div>

    <div class="main-content">
        <canvas id="flappyCanvas" width="320" height="480"></canvas>

        <div class="leaderboard-box">
            <h3 style="margin-top: 0; color: #f9d423; text-align: center; margin-bottom: 5px;">🏆 Flappy-Rangliste</h3>
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th>Platz</th>
                        <th>Name</th>
                        <th>Highscore</th>
                    </tr>
                </thead>
                <tbody>
                    {% for player, score in leaderboard %}
                    <tr>
                        <td>{{ loop.index }}.</td>
                        <td>{{ player }}</td>
                        <td>{{ score }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <div class="footer-bar">
        <span>Drücke die <b>Leertaste</b>, <b>Enter</b> oder klicke ins Feld zum Springen! 🚀</span>
    </div>

    <script>
        const canvas = document.getElementById('flappyCanvas');
        const ctx = canvas.getContext('2d');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        // --- VOLLBILD STEUERUNG ---
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                const element = document.documentElement;
                if (element.requestFullscreen) {
                    element.requestFullscreen();
                } else if (element.mozRequestFullScreen) {
                    element.mozRequestFullScreen();
                } else if (element.webkitRequestFullscreen) {
                    element.webkitRequestFullscreen();
                } else if (element.msRequestFullscreen) {
                    element.msRequestFullscreen();
                }
                fullscreenBtn.textContent = "📺 Vollbild beenden";
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
                fullscreenBtn.textContent = "📺 Vollbildmodus";
            }
        });

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                fullscreenBtn.textContent = "📺 Vollbildmodus";
            }
        });

        // --- SPIELVARIABLEN ---
        let birdY = 200;
        let birdVelocity = 0;
        const gravity = 0.4;
        const jump = -6.5;
        let score = 0;
        let gameActive = false;
        let gameOver = false;

        // Rohre
        let pipes = [];
        const pipeWidth = 52;
        const pipeGap = 110;
        let frameCount = 0;

        // Dummy-Grafiken zeichnen (Falls du Bilder hast, kannst du diese hier laden)
        function draw() {
            // Hintergrund-Himmel
            ctx.fillStyle = '#70c5ce';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Wolken/Boden (vereinfacht)
            ctx.fillStyle = '#ded895';
            ctx.fillRect(0, canvas.height - 50, canvas.width, 50);
            ctx.fillStyle = '#73bf2e';
            ctx.fillRect(0, canvas.height - 58, canvas.width, 8);

            // Rohre zeichnen
            pipes.forEach(pipe => {
                ctx.fillStyle = '#73bf2e';
                ctx.strokeStyle = '#55801a';
                ctx.lineWidth = 3;

                // Oberes Rohr
                ctx.fillRect(pipe.x, 0, pipeWidth, pipe.top);
                ctx.strokeRect(pipe.x, 0, pipeWidth, pipe.top);

                // Unteres Rohr
                ctx.fillRect(pipe.x, canvas.height - pipe.bottom, pipeWidth, pipe.bottom);
                ctx.strokeRect(pipe.x, canvas.height - pipe.bottom, pipeWidth, pipe.bottom);
            });

            // Vogel zeichnen
            ctx.fillStyle = '#f9d423';
            ctx.beginPath();
            ctx.arc(60, birdY, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Auge
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(64, birdY - 4, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(65, birdY - 4, 1.5, 0, Math.PI * 2);
            ctx.fill();

            // Schnabel
            ctx.fillStyle = '#ff9f43';
            ctx.beginPath();
            ctx.moveTo(70, birdY - 2);
            ctx.lineTo(80, birdY + 1);
            ctx.lineTo(70, birdY + 4);
            ctx.closePath();
            ctx.fill();

            // Score-Anzeige
            ctx.fillStyle = 'white';
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 4;
            ctx.font = 'bold 32px Arial';
            ctx.textAlign = 'center';
            ctx.strokeText(score, canvas.width / 2, 50);
            ctx.fillText(score, canvas.width / 2, 50);

            if (!gameActive && !gameOver) {
                ctx.font = 'bold 18px Arial';
                ctx.strokeText("Klicke zum Starten!", canvas.width / 2, canvas.height / 2);
                ctx.fillText("Klicke zum Starten!", canvas.width / 2, canvas.height / 2);
            }

            if (gameOver) {
                ctx.font = 'bold 24px Arial';
                ctx.fillStyle = '#ff2e63';
                ctx.strokeText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);
                
                ctx.font = 'bold 16px Arial';
                ctx.fillStyle = 'white';
                ctx.strokeText("Klicke für Neustart", canvas.width / 2, canvas.height / 2 + 20);
                ctx.fillText("Klicke für Neustart", canvas.width / 2, canvas.height / 2 + 20);
            }
        }

        function update() {
            if (gameActive && !gameOver) {
                birdVelocity += gravity;
                birdY += birdVelocity;

                // Kollision mit Boden oder Decke
                if (birdY + 12 >= canvas.height - 58 || birdY - 12 <= 0) {
                    triggerGameOver();
                }

                // Rohre bewegen und erstellen
                frameCount++;
                if (frameCount % 100 === 0) {
                    const topLimit = 50;
                    const bottomLimit = canvas.height - 58 - pipeGap - 50;
                    const topHeight = Math.floor(Math.random() * (bottomLimit - topLimit)) + topLimit;
                    const bottomHeight = canvas.height - 58 - pipeGap - topHeight;

                    pipes.push({
                        x: canvas.width,
                        top: topHeight,
                        bottom: bottomHeight,
                        passed: false
                    });
                }

                pipes.forEach(pipe => {
                    pipe.x -= 2;

                    // Kollisionsprüfung mit Rohren
                    if (60 + 12 > pipe.x && 60 - 12 < pipe.x + pipeWidth) {
                        if (birdY - 12 < pipe.top || birdY + 12 > canvas.height - pipe.bottom) {
                            triggerGameOver();
                        }
                    }

                    // Score erhöhen, wenn Rohr passiert
                    if (!pipe.passed && pipe.x + pipeWidth < 60) {
                        score++;
                        pipe.passed = true;
                    }
                });

                // Abgelaufene Rohre entfernen
                pipes = pipes.filter(pipe => pipe.x + pipeWidth > 0);
            }
        }

        function triggerGameOver() {
            gameOver = true;
            gameActive = false;
            submitScore(score);
        }

        function resetGame() {
            birdY = 200;
            birdVelocity = 0;
            score = 0;
            pipes = [];
            frameCount = 0;
            gameOver = false;
            gameActive = true;
        }

        function action() {
            if (gameOver) {
                resetGame();
            } else if (!gameActive) {
                gameActive = true;
            } else {
                birdVelocity = jump;
            }
        }

        // --- EVENTS ---
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') {
                e.preventDefault();
                action();
            }
        });

        canvas.addEventListener('mousedown', (e) => {
            e.preventDefault();
            action();
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            action();
        }, { passive: false });

        // API Score Übertragung
        async function submitScore(finalScore) {
            try {
                const response = await fetch('/api/submit-flappy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ score: finalScore })
                });
                if (response.ok) {
                    setTimeout(() => {
                        window.location.reload();
                    }, 1500);
                }
            } catch (e) {
                console.error("Score-Übertragungsfehler:", e);
            }
        }

        // Game Loop
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
