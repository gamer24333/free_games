<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klassen-Chat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .chat-container {
            max-width: 600px;
            margin: 20px auto;
            background: #1e1e1e;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 450px;
        }
        .chat-box {
            flex-grow: 1;
            overflow-y: auto;
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid #333;
            margin-bottom: 15px;
        }
        .message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            background: #2d2d2d;
            max-width: 80%;
            width: fit-content;
        }
        .message b {
            color: #00adb5;
            display: block;
            font-size: 12px;
            margin-bottom: 2px;
        }
        .chat-input-area {
            display: flex;
            gap: 10px;
        }
        .chat-input-area input {
            flex-grow: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #2d2d2d;
            color: white;
            font-size: 16px;
        }
        .chat-input-area button {
            padding: 10px 20px;
            background: #00adb5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <br>
    <a href="/welcome" class="btn btn-back">⬅️ Zurück zum Dashboard</a>

    <h1>💬 Unser geheimer Klassen-Chat</h1>

    <div class="chat-container">
        <div class="chat-box" id="chatBox">
            {% for msg in nachrichten %}
            <div class="message">
                <b>{{ msg.name }}</b>
                <span>{{ msg.text }}</span>
            </div>
            {% endfor %}
        </div>

        <form class="chat-input-area" method="POST" action="/chat">
            <input type="text" name="message" placeholder="Schreibe eine Nachricht..." autocomplete="off" required>
            <button type="submit">Senden</button>
        </form>
    </div>

    <script>
        function scrollToBottom() {
            const chatBox = document.getElementById('chatBox');
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        
        // Beim ersten Laden direkt nach unten scrollen
        scrollToBottom();

        // Alle 3 Sekunden neue Nachrichten vom Flask-Server ziehen
        setInterval(async () => {
            try {
                const response = await fetch('/api/chat-messages');
                if (response.ok) {
                    const nachrichten = await response.json();
                    const chatBox = document.getElementById('chatBox');
                    
                    // Aktuellen Scroll-Status prüfen
                    const wasAtBottom = chatBox.scrollHeight - chatBox.clientHeight <= chatBox.scrollTop + 50;
                    
                    // Box leeren und neu befüllen
                    chatBox.innerHTML = '';
                    nachrichten.forEach(msg => {
                        const msgDiv = document.createElement('div');
                        msgDiv.className = 'message';
                        msgDiv.innerHTML = `<b>${msg.name}</b><span>${msg.text}</span>`;
                        chatBox.appendChild(msgDiv);
                    });
                    
                    // Nur nach unten scrollen, wenn der User vorher auch ganz unten war
                    if (wasAtBottom) {
                        scrollToBottom();
                    }
                }
            } catch (error) {
                console.error("Fehler beim Abrufen der Nachrichten:", error);
            }
        }, 3000);
    </script>

</body>
</html>
