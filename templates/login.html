<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Klassen-Portal Login</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 100px; background-color: #222; color: white; }
        .login-box { background: #333; padding: 30px; display: inline-block; border-radius: 10px; max-width: 350px; }
        input, button { padding: 10px; margin: 10px; border-radius: 5px; border: none; box-sizing: border-box; }
        input { width: 90%; background-color: #444; color: white; }
        input::placeholder { color: #aaa; }
        button { background-color: #00adb5; color: white; cursor: pointer; width: 90%; font-weight: bold; }
        .error { color: #ff2e63; font-weight: bold; margin: 5px 10px; font-size: 14px; }
        .info { color: #f9d423; margin: 5px 10px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Wer bist du?</h2>
        
        {% if fehler %}
            <p class="error">❌ {{ fehler }}</p>
        {% endif %}
        
        {% if info %}
            <p class="info">💡 {{ info }}</p>
        {% endif %}
        
        <form method="POST">
            <input type="text" name="nutzername" value="{{ name_vorbefuellt if name_vorbefuellt else '' }}" placeholder="Dein Vorname" required><br>
            
            <input type="password" name="pin" placeholder="Deine PIN (beim 1. Mal aussuchen)" required><br>
            
            <button type="submit">Einlass fordern</button>
        </form>
    </div>

</body>
</html>
