<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Jump - Tank Royale Portal</title>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%;
            background-color: #222; font-family: Arial, sans-serif;
            color: white; display: flex; flex-direction: column; overflow: hidden;
        }

        .header-bar { background-color: #161616; padding: 10px; text-align: center; border-bottom: 2px solid #2d2d2d; z-index: 10; }
        .main-content { flex: 1; display: flex; justify-content: center; align-items: flex-start; gap: 30px; padding: 20px; flex-wrap: wrap; overflow-y: auto; }
        .footer-bar { background-color: #161616; padding: 12px 10px; text-align: center; border-top: 2px solid #2d2d2d; font-size: 14px; color: #ccc; z-index: 10; }

        h1 { margin: 0; font-size: 22px; color: #b142ff; display: inline-block; vertical-align: middle; }
        .btn { display: inline-block; padding: 8px 16px; background: #555; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; border: none; }
        .btn:hover { background: #444; }
        .btn-back { float: left; }

        .game-container { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .game-controls-info {
            display: flex; flex-direction: column; width: 400px; font-size: 14px; color: #ccc;
            padding: 10px; background: #1a1a1a; border-radius: 8px; border: 1px solid #333; gap: 8px; box-sizing: border-box;
        }
        .info-row { display: flex; justify-content: space-between; width: 100%; }
        .fullscreen-link { color: #ff9f43; text-decoration: underline; cursor: pointer; font-weight: bold; }
        .fullscreen-link:hover { color: #e08b35; }

        /* Das Canvas ist hier etwas höher, passend für ein Spring-Spiel */
        #gameCanvas {
            border: 4px solid #b142ff; border-radius: 12px; background: #111;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6); display: block;
        }

        .game-container:fullscreen { background-color: #111; width: 100vw; height: 100vh; justify-content: center; }
        .game-container:-webkit-full-screen { background-color: #111; width: 100vw; height: 100vh; justify-content: center; }
        .game-container:fullscreen #gameCanvas { height: 90vh !important; width: auto !important; max-width: 90vw !important; aspect-ratio: 4/6; }
        .game-container:-webkit-full-screen #gameCanvas { height: 90vh !important; width: auto !important; max-width: 90vw !important; aspect-ratio: 4/6; }
        .game-container:fullscreen .game-controls-info { width: auto !important; max-width: 90vw !important; font-size: 16px; min-width: 400px; }
        .game-container:-webkit-full-screen .game-controls-info { width: auto !important; max-width: 90vw !important; font-size: 16px; min-width: 400px; }

        .leaderboard-box { background: #333; border: 2px solid #444; border-radius: 12px; width: 280px; padding: 20px; box-sizing: border-box; text-align: left; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .leaderboard-table th, .leaderboard-table td { padding: 6px 8px; border-bottom: 1px solid #444; text-align: left; font-size: 14px; }
        .leaderboard-table th { color: #b142ff; }
        .leaderboard-table tr:nth-child(1) td { color: #ffd700; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header-bar">
        <a href="/games" class="btn btn-back">⬅️ Zurück</a>
        <h1>🚀 Neon Jump</h1>
    </div>

    <div class="main-content">
        <div class="game-container">
            <canvas id="gameCanvas" width="400" height="600"></canvas>
            
            <div class="game-controls-info">
                <div class="info-row">
                    <span>🎮 <b>A/D</b> oder <b>Pfeile Links/Rechts</b></span>
                    <span id="fullscreenLink" class="fullscreen-link" onclick="toggleFullscreen()">📺 [F] Vollbild</span>
                    <span>⏸️ <b>ESC</b> / <b>P</b></span>
                </div>
                <div class="info-row">
                    <span style="color: #00adb5;">Federn nutzen, Monstern ausweichen!</span>
                    <span>Höhe: <b id="scoreText" style="color: #39ff14; font-size:16px;">0</b></span>
                </div>
            </div>
        </div>

        <div class="leaderboard-box">
            <h3 style="margin-top: 0; color: #b142ff; text-align: center; margin-bottom: 5px;">🏆 Rangliste</h3>
            <table class="leaderboard-table">
                <thead><tr><th>Platz</th><th>Name</th><th>Höhe</th></tr></thead>
                <tbody>
                    {% for player, score in leaderboard %}
                    <tr><td>{{ loop.index }}.</td><td>{{ player }}</td><td>{{ score }}</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('scoreText');
        const gameContainer = document.querySelector('.game-container');
        const fullscreenLink = document.getElementById('fullscreenLink');

        let player, platforms, springs, monsters;
        let score, highestScore, isGameOver, gameStarted, isPaused;
        let leftPressed = false;
        let rightPressed = false;

        const GRAVITY = 0.35;
        const JUMP_POWER = -9;
        const SPRING_POWER = -15;

        function resetGame() {
            player = { x: 200, y: 400, w: 30, h: 30, dx: 0, dy: 0 };
            platforms = [];
            springs = [];
            monsters = [];
            score = 0;
            highestScore = 0;
            scoreEl.textContent = 0;
            
            isGameOver = false;
            gameStarted = false;
            isPaused = false;
            
            // Start-Plattform generieren
            platforms.push({ x: 170, y: 580, w: 60, h: 12, type: 'normal' });
            
            // Erste Plattformen verteilen
            for (let i = 0; i < 8; i++) {
                spawnPlatform(600 - (i * 70) - 50);
            }
        }

        function spawnPlatform(y) {
            let r = Math.random();
            let type = 'normal'; // Grün
            
            // Je höher man kommt, desto weniger normale Plattformen
            if (score > 1000 && r < 0.2) type = 'moving'; // Blau
            else if (score > 2000 && r < 0.35) type = 'breakable'; // Orange
            else if (score > 3000 && r < 0.3) type = 'moving';

            let p = { 
                x: Math.random() * (canvas.width - 60), 
                y: y, 
                w: 60, 
                h: 12, 
                type: type, 
                dx: (Math.random() > 0.5 ? 1.5 : -1.5) 
            };
            platforms.push(p);

            // Feder spawnen? (Nur auf normalen Plattformen)
            if (type === 'normal' && Math.random() < 0.15) {
                springs.push({ x: p.x + 20, y: p.y - 12, w: 20, h: 12, platform: p });
            }
            
            // Monster spawnen? (Nur wenn keine Feder da ist und selten)
            if (type === 'normal' && score > 1500 && Math.random() < 0.08 && !springs.find(s => s.platform === p)) {
                monsters.push({ x: p.x + 10, y: p.y - 30, w: 40, h: 30, platform: p, dx: (Math.random() > 0.5 ? 1 : -1) });
            }
        }

        // Steuerung
        window.addEventListener('keydown', e => {
            const k = e.key.toLowerCase();
            if (['a', 'arrowleft'].includes(k)) { leftPressed = true; gameStarted = true; }
            if (['d', 'arrowright'].includes(k)) { rightPressed = true; gameStarted = true; }
            if ([' '].includes(k)) gameStarted = true;
            
            if (e.key === 'f' || e.key === 'F') { toggleFullscreen(); return; }
            if (e.key === 'p' || e.key === 'Escape') {
                if (gameStarted && !isGameOver) isPaused = !isPaused;
            }
            
            if (isGameOver && ['a','d','arrowleft','arrowright',' '].includes(k)) {
                resetGame();
                gameStarted = true;
            }
        });

        window.addEventListener('keyup', e => {
            const k = e.key.toLowerCase();
            if (['a', 'arrowleft'].includes(k)) leftPressed = false;
            if (['d', 'arrowright'].includes(k)) rightPressed = false;
        });

        function update() {
            if (!gameStarted || isGameOver || isPaused) return;

            // X-Bewegung
            if (leftPressed) player.dx = -5;
            else if (rightPressed) player.dx = 5;
            else player.dx = 0;

            player.x += player.dx;

            // Portal-Effekt (links raus -> rechts rein)
            if (player.x < -player.w) player.x = canvas.width;
            if (player.x > canvas.width) player.x = -player.w;

            // Y-Bewegung & Schwerkraft
            player.dy += GRAVITY;
            player.y += player.dy;

            // Kamera verschieben, wenn Spieler hoch springt
            if (player.y < canvas.height / 2) {
                let diff = (canvas.height / 2) - player.y;
                player.y = canvas.height / 2;
                
                // Alle Objekte nach unten schieben
                platforms.forEach(p => p.y += diff);
                springs.forEach(s => s.y += diff);
                monsters.forEach(m => m.y += diff);
                
                score += diff;
                if (Math.floor(score) > highestScore) {
                    highestScore = Math.floor(score);
                    scoreEl.textContent = highestScore;
                }
            }

            // Plattformen aufräumen & neu spawnen
            platforms = platforms.filter(p => p.y < canvas.height + 50);
            springs = springs.filter(s => s.y < canvas.height + 50);
            monsters = monsters.filter(m => m.y < canvas.height + 50);

            while (platforms.length > 0 && platforms[platforms.length - 1].y > 50) {
                spawnPlatform(platforms[platforms.length - 1].y - (Math.random() * 30 + 60));
            }

            // Kollisionen (Nur beim Fallen!)
            if (player.dy > 0) {
                // Plattformen
                platforms.forEach(p => {
                    if (player.x + player.w - 5 > p.x && player.x + 5 < p.x + p.w &&
                        player.y + player.h >= p.y && player.y + player.h <= p.y + p.h + 10) {
                        
                        if (p.type === 'breakable') {
                            p.broken = true; // Plattform kaputt!
                        } else {
                            player.dy = JUMP_POWER; // Normaler Sprung
                        }
                    }
                });

                // Federn
                springs.forEach(s => {
                    if (player.x + player.w > s.x && player.x < s.x + s.w &&
                        player.y + player.h >= s.y && player.y + player.h <= s.y + s.h + 10) {
                        player.dy = SPRING_POWER; // Mega-Sprung
                    }
                });
                
                // Monster töten (auf den Kopf springen)
                monsters.forEach(m => {
                    if (player.x + player.w > m.x && player.x < m.x + m.w &&
                        player.y + player.h >= m.y && player.y + player.h <= m.y + m.h + 10) {
                        player.dy = JUMP_POWER;
                        m.dead = true;
                    }
                });
            }

            // Kaputte/Tote Objekte entfernen
            platforms = platforms.filter(p => !p.broken);
            monsters = monsters.filter(m => !m.dead);

            // Tödliche Kollision mit Monstern (von unten oder Seite)
            monsters.forEach(m => {
                if (player.x + player.w - 5 > m.x && player.x + 5 < m.x + m.w &&
                    player.y + player.h - 5 > m.y && player.y + 5 < m.y + m.h) {
                    triggerGameOver();
                }
            });

            // Plattformen und Monster bewegen
            platforms.forEach(p => {
                if (p.type === 'moving') {
                    p.x += p.dx;
                    if (p.x < 0 || p.x + p.w > canvas.width) p.dx *= -1;
                }
            });
            monsters.forEach(m => {
                m.x += m.dx;
                if (m.x < m.platform.x || m.x + m.w > m.platform.x + m.platform.w) m.dx *= -1;
            });
            springs.forEach(s => {
                if (s.platform.type === 'moving') {
                    s.x += s.platform.dx;
                }
            });

            // Tod durch Runterfallen
            if (player.y > canvas.height) {
                triggerGameOver();
            }
        }

        function draw() {
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Neon Grid Background (leicht sichtbar)
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
            for(let i=0; i<canvas.height; i+=40) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke(); }

            // Plattformen
            platforms.forEach(p => {
                if (p.type === 'normal') ctx.fillStyle = '#39ff14'; // Grün
                else if (p.type === 'moving') ctx.fillStyle = '#00adb5'; // Blau
                else if (p.type === 'breakable') ctx.fillStyle = '#ff9f43'; // Orange
                
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(p.x, p.y, p.w, p.h, 6);
                else ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.fill();
            });

            // Federn (Gelb)
            springs.forEach(s => {
                ctx.fillStyle = '#ffd700';
                ctx.fillRect(s.x, s.y, s.w, s.h);
                ctx.fillStyle = '#111'; // Rillen
                ctx.fillRect(s.x, s.y + 3, s.w, 2);
                ctx.fillRect(s.x, s.y + 8, s.w, 2);
            });

            // Monster (Rot)
            monsters.forEach(m => {
                ctx.fillStyle = '#ff2e63';
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(m.x, m.y, m.w, m.h, 8);
                else ctx.fillRect(m.x, m.y, m.w, m.h);
                ctx.fill();
                
                // Fiese Augen
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(m.x + 10, m.y + 10, 4, 0, Math.PI*2); ctx.arc(m.x + 30, m.y + 10, 4, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#000';
                ctx.beginPath(); ctx.arc(m.x + 10, m.y + 11, 2, 0, Math.PI*2); ctx.arc(m.x + 30, m.y + 11, 2, 0, Math.PI*2); ctx.fill();
            });

            // Spieler (Alien / Leuchtendes Quadrat)
            ctx.fillStyle = '#b142ff';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#b142ff';
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(player.x, player.y, player.w, player.h, 10);
            else ctx.fillRect(player.x, player.y, player.w, player.h);
            ctx.fill();
            ctx.shadowBlur = 0; // Reset für andere Objekte
            
            // Spieler Augen (gucken in Laufrichtung)
            ctx.fillStyle = '#fff';
            let eyeOffsetX = player.dx > 0 ? 5 : (player.dx < 0 ? -5 : 0);
            ctx.beginPath(); ctx.arc(player.x + 10 + eyeOffsetX, player.y + 10, 3, 0, Math.PI*2); ctx.arc(player.x + 20 + eyeOffsetX, player.y + 10, 3, 0, Math.PI*2); ctx.fill();

            // Overlays
            if (isPaused) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.65)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ffeb3b'; ctx.font = 'bold 36px Arial'; ctx.textAlign = 'center';
                ctx.fillText('PAUSIERT', canvas.width / 2, canvas.height / 2);
                ctx.textAlign = 'left';
            }

            if (!gameStarted && !isGameOver && !isPaused) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#39ff14'; ctx.font = 'bold 22px Arial'; ctx.textAlign = 'center';
                ctx.fillText('A / D oder Pfeiltasten', canvas.width / 2, canvas.height / 2 - 10);
                ctx.fillStyle = '#fff'; ctx.font = '15px Arial';
                ctx.fillText('um zu starten!', canvas.width / 2, canvas.height / 2 + 20);
                ctx.textAlign = 'left';
            }

            if (isGameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.85)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff5252'; ctx.font = 'bold 32px Arial'; ctx.textAlign = 'center';
                ctx.fillText('ABGESTÜRZT!', canvas.width / 2, canvas.height / 2 - 15);
                ctx.fillStyle = '#fff'; ctx.font = '16px Arial';
                ctx.fillText('Drücke A / D für Neustart', canvas.width / 2, canvas.height / 2 + 25);
                ctx.textAlign = 'left';
            }
        }

        async function triggerGameOver() {
            isGameOver = true;
            try {
                await fetch('/api/submit-doodle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ score: highestScore })
                });
            } catch(e) { console.error("Score Error:", e); }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                if (gameContainer.requestFullscreen) { gameContainer.requestFullscreen(); }
                else if (gameContainer.webkitRequestFullscreen) { gameContainer.webkitRequestFullscreen(); }
                fullscreenLink.textContent = "📺 [F] Vollbild beenden";
            } else {
                if (document.exitFullscreen) { document.exitFullscreen(); }
                fullscreenLink.textContent = "📺 [F] Vollbild";
            }
        }
        
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) fullscreenLink.textContent = "📺 [F] Vollbild";
        });

        resetGame();
        
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    </script>
</body>
</html>
