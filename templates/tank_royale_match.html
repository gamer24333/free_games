<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tank Royale Match</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #1a1a1a; color: white; margin: 0; padding: 10px; font-size: 16px; }
        h2 { font-size: 28px; margin-bottom: 5px; } 
        
        canvas { background: linear-gradient(to bottom, #111 60%, #1f1f2e 100%); border: 4px solid #ff9f43; border-radius: 8px; margin-top: 10px; max-width: 100%; height: auto; touch-action: none; }
        .controls-info { background: #222; max-width: 900px; margin: 10px auto; padding: 20px; border-radius: 8px; font-size: 18px; color: #ccc; } 
        .weapon-selector { display: flex; justify-content: center; gap: 15px; margin: 20px 0; }
        .btn-weapon { background: #444; color: white; border: 2px solid #666; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-weapon.active { background: #ff9f43; color: black; border-color: #fff; }
        .btn-weapon:disabled { background: #222; color: #555; border-color: #333; cursor: not-allowed; }
        .button-row { display: flex; justify-content: center; gap: 20px; margin-top: 10px; }
        .btn-move { background: #333; color: white; border: 1px solid #555; padding: 15px 30px; font-size: 22px; border-radius: 5px; user-select: none; cursor: pointer; }
        .btn-shoot { background: #ff2e63; color: white; border: none; padding: 16px 40px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 20px; margin-top: 15px; width: 100%; max-width: 400px; }
        #lockStatus { font-weight: bold; color: #76ff03; font-size: 18px; }
        .btn-back { display: inline-block; background: #555; color: white; padding: 10px 20px; text-decoration: none; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>

    <a href="/tankroyale" class="btn btn-back" style="margin-top:10px;">⬅️ Zurück zum Menü</a>
    <h2 id="matchInfo">Verbinde zum Spiel...</h2>

    <canvas id="tankCanvas" width="900" height="500"></canvas>

    <div class="controls-info">
        <span id="lockStatus">Visier: Ziehe auf dem Bildschirm zum Zielen</span>
        
        <div class="weapon-selector">
            <button class="btn-weapon active" id="wpn-standard" onclick="selectWeapon('standard')">Normal (∞)</button>
            <button class="btn-weapon" id="wpn-berta" onclick="selectWeapon('berta')">Dicke Berta (<span id="ammo-berta">3</span>)</button>
            <button class="btn-weapon" id="wpn-triple" onclick="selectWeapon('triple')">Streuschuss (<span id="ammo-triple">2</span>)</button>
        </div>

        <div class="button-row">
            <button class="btn-move" id="moveLeftBtn">⬅️ Links</button>
            <button class="btn-move" id="moveRightBtn">Rechts ➡️</button>
        </div>
        
        <button class="btn-shoot" id="shootBtn" disabled>FEUER! 🔥</button>
    </div>

    <script>
        // Sicheres Fallback für Jinja-Variablen
        const gameId = "{{ gameId or 'offline_bot_game' }}";
        const me = "{{ me or 'Spieler 1' }}";
        const gegnerName = "{{ gegner or 'Computer-Bot 🤖' }}";
        
        const canvas = document.getElementById('tankCanvas');
        const ctx = canvas.getContext('2d');
        const shootBtn = document.getElementById('shootBtn');
        const lockStatusText = document.getElementById('lockStatus');

        let gameState = {};
        let bullets = []; 
        const gravity = 0.15;

        let myAngle = 45;
        let myPower = 12; 
        let myXOffset = 0;
        let isAiming = false; 
        let selectedWeapon = 'standard';

        let myFuel = 100;
        let ammoBerta = 3;
        let ammoTriple = 2;
        let crate = { x: -100, y: -100, active: false };

        let isBotMode = false;
        let botCalculated = false; // Verhindert mehrfaches Berechnen

        let moveLeftActive = false; let moveRightActive = false;
        const keys = {};
        window.addEventListener('keydown', e => { keys[e.key] = true; });
        window.addEventListener('keyup', e => { keys[e.key] = false; });

        // Backup-/Startgelände falls API lädt (901 Punkte passend zu Canvas-Breite 900)
        let terrainPoints = [];
        for (let x = 0; x <= 900; x++) {
            let y = 400 + Math.sin(x * 0.008) * 40 + Math.cos(x * 0.02) * 10;
            terrainPoints.push(y);
        }

        // --- AUTOMATISCHE INITIALISIERUNG ---
        function initMatch() {
        const gegnerNameClean = gegnerName.toLowerCase();
        const gameIdClean = gameId.toLowerCase();
    
        // Erkennt zuverlässig, ob es sich um ein Bot-Match handelt
        if (
            gameIdClean === "offline_bot_game" || 
            gameIdClean.includes("bot") || 
            gegnerNameClean.includes("bot") || 
            gegnerNameClean.includes("computer")
        ) {
            isBotMode = true;
            initBotGame();
        } else {
            isBotMode = false;
            // Sofortige Synchronisierung für echte Spieler im Multiplayer
            updateStatus();
        }
    }
        function initBotGame() {
            gameState = {
                status: "aktiv",
                turn: me,
                ersteller: me,
                gegner: "Computer-Bot 🤖",
                p1_x: 150,
                p2_x: 750,
                p1_hp: 100,
                p2_hp: 100,
                raw_state: "100,100,150,750,100,100,3,2,3,2,-1,-1,0"
            };
            document.getElementById('matchInfo').innerText = "🔴 DU BIST DRAN! (Gegen Bot)";
            shootBtn.disabled = false;
        }

        function selectWeapon(type) {
            selectedWeapon = type;
            document.querySelectorAll('.btn-weapon').forEach(b => b.classList.remove('active'));
            document.getElementById(`wpn-${type}`).classList.add('active');
        }

        function calculateAim(clientX, clientY) {
            if (gameState.turn !== me || gameState.status !== "aktiv" || bullets.length > 0) return;
            const rect = canvas.getBoundingClientRect();
            const mouseX = ((clientX - rect.left) / rect.width) * canvas.width;
            const mouseY = ((clientY - rect.top) / rect.height) * canvas.height;

            let amIErsteller = (me === gameState.ersteller);
            let currentX = amIErsteller ? gameState.p1_x + myXOffset : gameState.p2_x + myXOffset;
            let startY = terrainPoints[Math.floor(Math.max(0, Math.min(canvas.width - 1, currentX)))] - 15;

            let dx = mouseX - currentX; let dy = startY - mouseY;
            if (!amIErsteller) dx = -dx;

            let rad = Math.atan2(dy, dx);
            myAngle = Math.round(rad * (180 / Math.PI));
            if (myAngle < 0) myAngle = 0; if (myAngle > 90) myAngle = 90;
            
            let distance = Math.sqrt(dx*dx + dy*dy);
            myPower = Math.min(16, Math.max(4, Math.round(distance / 25)));
            
            lockStatusText.innerText = `Winkel: ${myAngle}° | Kraft: ${myPower}`;
        }

        // Mouse & Touch-Steuerung
        canvas.addEventListener('mousedown', (e) => { isAiming = true; calculateAim(e.clientX, e.clientY); });
        canvas.addEventListener('mousemove', (e) => { if (isAiming) calculateAim(e.clientX, e.clientY); });
        window.addEventListener('mouseup', () => { isAiming = false; });
        canvas.addEventListener('touchstart', (e) => {
            isAiming = true;
            if(e.touches.length > 0) calculateAim(e.touches[0].clientX, e.touches[0].clientY);
            if (e.cancelable) e.preventDefault();
        }, { passive: false });
        canvas.addEventListener('touchmove', (e) => {
            if (!isAiming) return;
            if(e.touches.length > 0) calculateAim(e.touches[0].clientX, e.touches[0].clientY);
            if (e.cancelable) e.preventDefault();
        }, { passive: false });
        window.addEventListener('touchend', () => { isAiming = false; });

        // --- BOT GEGENZUG LOGIK ---
        function triggerBotTurn() {
            // Absolute Absicherung vor Mehrfachfeuer
            if (!isBotMode || botCalculated || gameState.status !== "aktiv" || bullets.length > 0) return;
            botCalculated = true;

            document.getElementById('matchInfo').innerText = "🤖 Bot berechnet Schuss...";
            shootBtn.disabled = true;

            setTimeout(() => {
                // Sicherstellen, dass der Status sich während des Wartens nicht geändert hat
                if (gameState.turn !== "Computer-Bot 🤖" || gameState.status !== "aktiv") {
                    botCalculated = false;
                    return;
                }

                let p1_x = gameState.p1_x;
                let p2_x = gameState.p2_x;
                let startY = terrainPoints[p2_x] - 17;

                let dx = p1_x - p2_x;
                let targetAngle = 35 + Math.floor(Math.random() * 25);
                let targetPower = Math.min(16, Math.max(7, Math.round(Math.abs(dx) / 45) + (Math.random() * 4 - 2)));

                let rad = (targetAngle * Math.PI) / 180;
                
                // Bot feuert Kugel ab
                bullets = [{
                    x: p2_x,
                    y: startY,
                    vx: Math.cos(rad) * (targetPower * 1.2) * -1,
                    vy: -Math.sin(rad) * (targetPower * 1.2),
                    type: Math.random() > 0.7 ? 'berta' : 'standard',
                    active: true
                }];

            }, 1800);
        }

        // --- SERVER-STATUS SYNCHRONISIERUNG ---
        async function updateStatus() {
            if (isBotMode) return;
            try {
                let res = await fetch(`/api/tankroyale/status/${encodeURIComponent(gameId)}`);
                if (!res.ok) return;
                gameState = await res.json();
                
                // Server-Terrain anwenden
                if (gameState.terrain && gameState.terrain.length > 0) {
                    terrainPoints = gameState.terrain;
                }
                
                let st = gameState.raw_state ? gameState.raw_state.split(',').map(Number) : [];
                while(st.length < 13) { st.push(0); }
                
                let amIErsteller = (me === gameState.ersteller);

                if (gameState.turn !== me) {
                    myXOffset = 0; 
                    myFuel = amIErsteller ? st[4] : st[5];
                }
                
                ammoBerta = amIErsteller ? st[6] : st[8];
                ammoTriple = amIErsteller ? st[7] : st[9];

                document.getElementById('ammo-berta').innerText = ammoBerta;
                document.getElementById('ammo-triple').innerText = ammoTriple;
                document.getElementById('wpn-berta').disabled = ammoBerta <= 0;
                document.getElementById('wpn-triple').disabled = ammoTriple <= 0;

                if (crate.active !== (st[12] === 1)) {
                    crate.x = st[10]; 
                    crate.y = st[11]; 
                    crate.active = st[12] === 1;
                }

                const isMyTurn = (gameState.turn === me && gameState.status === "aktiv");
                shootBtn.disabled = !isMyTurn || bullets.length > 0;
                if (gameState.status === "aktiv") {
                    document.getElementById('matchInfo').innerText = isMyTurn ? "🔴 DU BIST DRAN!" : `⏳ ${gameState.turn} zielt...`;
                } else if (gameState.status.startsWith("gewonnen")) {
                    let sieger = gameState.status.split('_')[1];
                    document.getElementById('matchInfo').innerText = `🏆 ${sieger} HAT GEWONNEN!`;
                    shootBtn.disabled = true;
                }
            } catch (e) { console.error(e); }
        }
        
        function handleInput() {
            if (gameState.turn !== me || gameState.status !== "aktiv" || bullets.length > 0) return;
            if (myFuel > 0) {
                if (keys['a'] || keys['A'] || moveLeftActive) { myXOffset -= 1.5; myFuel -= 0.5; }
                if (keys['d'] || keys['D'] || moveRightActive) { myXOffset += 1.5; myFuel -= 0.5; }
                myFuel = Math.max(0, myFuel);
            }
        }

        ['touchstart', 'mousedown'].forEach(evt => {
            document.getElementById('moveLeftBtn').addEventListener(evt, (e) => { moveLeftActive = true; e.preventDefault(); });
            document.getElementById('moveRightBtn').addEventListener(evt, (e) => { moveRightActive = true; e.preventDefault(); });
        });
        ['touchend', 'mouseup'].forEach(evt => {
            document.getElementById('moveLeftBtn').addEventListener(evt, () => moveLeftActive = false);
            document.getElementById('moveRightBtn').addEventListener(evt, () => moveRightActive = false);
        });

        // Gelände mit Kollisionslimit deformieren
        function destroyTerrain(impactX, radius) {
            let startX = Math.max(0, Math.floor(impactX - radius));
            let endX = Math.min(canvas.width, Math.floor(impactX + radius));
            for (let x = startX; x < endX; x++) {
                let portion = Math.cos(((x - impactX) / radius) * (Math.PI / 2));
                if (portion > 0) {
                    terrainPoints[x] += radius * portion * 0.8;
                    if (terrainPoints[x] > canvas.height - 20) terrainPoints[x] = canvas.height - 20;
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Terrain zeichnen
            ctx.fillStyle = '#393e46'; ctx.beginPath(); ctx.moveTo(0, canvas.height);
            for (let x = 0; x <= canvas.width; x++) ctx.lineTo(x, terrainPoints[x]);
            ctx.lineTo(canvas.width, canvas.height); ctx.closePath(); ctx.fill();

            if (!gameState || !gameState.status) return;
            let amIErsteller = (me === gameState.ersteller);
            let st = gameState.raw_state ? gameState.raw_state.split(',').map(Number) : [];
            while(st.length < 13) { st.push(0); }
            
            let p1_f = amIErsteller ? myFuel : st[4];
            let p2_f = !amIErsteller ? myFuel : st[5];
            let p1_x = Math.max(20, Math.min(canvas.width - 20, Math.round(gameState.p1_x + (amIErsteller ? myXOffset : 0))));
            let p2_x = Math.max(20, Math.min(canvas.width - 20, Math.round(gameState.p2_x + (!amIErsteller ? myXOffset : 0))));

            let p1 = { x: p1_x, y: terrainPoints[p1_x] - 15, hp: st[0], fuel: p1_f, color: '#00adb5', name: gameState.ersteller, dX: 1 };
            let p2 = { x: p2_x, y: terrainPoints[p2_x] - 15, hp: st[1], fuel: p2_f, color: '#ff2e63', name: gameState.gegner || "Bot 🤖", dX: -1 };

            // Kisten-Logik
            if (crate.active) {
                let groundY = terrainPoints[Math.floor(crate.x)] - 12;
                if (crate.y < groundY) crate.y += 1.5;
                ctx.fillStyle = '#ff9f43'; ctx.fillRect(crate.x - 12, crate.y, 24, 24);
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(crate.x - 12, crate.y, 24, 24);
                
                let activeTank = amIErsteller ? p1 : p2;
                if (Math.abs(activeTank.x - crate.x) < 25 && Math.abs(activeTank.y - crate.y) < 25) {
                    crate.active = false;
                    if (isBotMode) {
                        myFuel = 100;
                    } else {
                        sendShotResult(myAngle, myPower, "crate_collected", p1.x, p2.x);
                    }
                }
            }

            // Panzer
            [p1, p2].forEach(p => {
                ctx.save();
                ctx.fillStyle = '#333'; ctx.fillRect(p.x - 22, p.y + 8, 44, 8);
                ctx.fillStyle = p.color; ctx.fillRect(p.x - 18, p.y, 36, 10);
                ctx.beginPath(); ctx.arc(p.x, p.y, 8, Math.PI, 0); ctx.fill();

                let rad = (p.name === me ? myAngle : 45) * Math.PI / 180;
                let direction = p.dX; 
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(p.x, p.y - 2);
                ctx.lineTo(p.x + Math.cos(rad) * 18 * direction, p.y - 2 - Math.sin(rad) * 18);
                ctx.stroke(); ctx.restore();

                ctx.fillStyle = '#fff'; ctx.font = "bold 15px Arial";
                ctx.fillText(`${p.name} (${p.hp} HP)`, p.x - 45, p.y - 35);
                ctx.fillStyle = '#555'; ctx.fillRect(p.x - 20, p.y - 15, 40, 5);
                ctx.fillStyle = '#76ff03'; ctx.fillRect(p.x - 20, p.y - 15, (p.fuel / 100) * 40, 5);
            });

            // Ziel-Hilfslinie
            if (gameState.turn === me && bullets.length === 0 && gameState.status === "aktiv") {
                let activeTank = amIErsteller ? p1 : p2;
                let rad = (myAngle * Math.PI) / 180;
                let pX = activeTank.x; let pY = activeTank.y - 2;
                let pVx = Math.cos(rad) * (myPower * 1.2) * (amIErsteller ? 1 : -1); 
                let pVy = -Math.sin(rad) * (myPower * 1.2);
                ctx.strokeStyle = '#f9d423'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(pX, pY);
                for (let i = 0; i < 40; i++) { pVy += gravity; pX += pVx; pY += pVy; ctx.lineTo(pX, pY); }
                ctx.stroke(); ctx.setLineDash([]);
            }

            // Projektile rendern
            // Projektile rendern
            if (bullets.length > 0) {
                let hitRegistered = false;
                let finalHitType = "none";

                bullets.forEach((bullet, index) => {
                    if (!bullet.active) return;

                    bullet.vy += gravity; bullet.x += bullet.vx; bullet.y += bullet.vy;
                    ctx.fillStyle = '#fff'; ctx.beginPath(); 
                    ctx.arc(bullet.x, bullet.y, bullet.type === 'berta' ? 8 : 5, 0, Math.PI*2); 
                    ctx.fill();

                    // Wer ist der Gegner dieses Schusses?
                    // Wenn der Schütze 'me' (ich) ist, ist das Ziel der Gegner (target = p2 im Bot-Modus oder eben der andere Spieler)
                    let target = (bullet.owner === me) ? p2 : p1;
                    
                    // Kollisionsprüfung NUR mit dem echten Gegner, niemals mit dem Schützen selbst!
                    if (bullet.x > target.x - 22 && bullet.x < target.x + 22 && bullet.y > target.y - 12 && bullet.y < target.y + 15) {
                        bullet.active = false;
                        hitRegistered = true;
                        finalHitType = (target === p2) ? "p2" : "p1";
                    } 
                    // Geländekollision
                    else if (bullet.x >= 0 && bullet.x <= canvas.width && bullet.y > terrainPoints[Math.floor(bullet.x)]) {
                        destroyTerrain(bullet.x, bullet.type === 'berta' ? 45 : 25);
                        bullet.active = false;
                        hitRegistered = true;
                        finalHitType = "terrain";
                    }
                    // Out of Bounds
                    else if (bullet.x < 0 || bullet.x > canvas.width || bullet.y > canvas.height) {
                        bullet.active = false;
                    }
                });

                if (bullets.every(b => !b.active)) {
                    bullets = []; 
                    if (isBotMode) {
                        resolveBotShot(finalHitType);
                    } else {
                        sendShotResult(myAngle, myPower, finalHitType, p1.x, p2.x);
                    }
                }
            }
            
        function fireTank() {
        if (gameState.turn !== me || gameState.status !== "aktiv" || bullets.length > 0) return;
        let amIErsteller = (me === gameState.ersteller);
        let currentX = Math.max(20, Math.min(canvas.width - 20, (amIErsteller ? gameState.p1_x + myXOffset : gameState.p2_x + myXOffset)));
        let startY = terrainPoints[Math.floor(currentX)] - 15; // Etwas höher ansetzen (Panzermitte)
    
        bullets = []; 
        let direction = amIErsteller ? 1 : -1;
        let rad = (myAngle * Math.PI) / 180;
    
        // Wir berechnen das Rohrende, damit die Kugel nicht im Panzer startet
        const rohrLaenge = 22; 
        let spawnX = currentX + Math.cos(rad) * rohrLaenge * direction;
        let spawnY = startY - 2 - Math.sin(rad) * rohrLaenge;
    
        if (selectedWeapon === 'triple') {
            let offsets = [-6, 0, 6];
            offsets.forEach(offset => {
                let r = ((myAngle + offset) * Math.PI) / 180;
                bullets.push({
                    x: spawnX, y: spawnY,
                    vx: Math.cos(r) * (myPower * 1.2) * direction,
                    vy: -Math.sin(r) * (myPower * 1.2),
                    type: 'triple',
                    owner: me, // Wir merken uns, wer geschossen hat!
                    active: true
                });
            });
        } else {
            bullets.push({
                x: spawnX, y: spawnY,
                vx: Math.cos(rad) * (myPower * 1.2) * direction,
                vy: -Math.sin(rad) * (myPower * 1.2),
                type: selectedWeapon,
                owner: me, // Wir merken uns, wer geschossen hat!
                active: true
            });
        }
        shootBtn.disabled = true;
    }

        function resolveBotShot(hit) {
            let st = gameState.raw_state.split(',').map(Number);
            let p1_hp = st[0];
            let p2_hp = st[1];
        
            // Schadensberechnung je nach Waffentyp
            let dmg = 20; // Standard-Schaden
            if (selectedWeapon === 'berta') {
                dmg = 45;
            } else if (selectedWeapon === 'triple') {
                dmg = 15; // 15 Schaden pro Treffer (da man mehrfach treffen kann)
            }
        
            if (gameState.turn === me) {
                if (hit === "p2") p2_hp = Math.max(0, p2_hp - dmg);
                gameState.p1_x = Math.max(20, Math.min(canvas.width - 20, gameState.p1_x + myXOffset));
                gameState.turn = "Computer-Bot 🤖";
                document.getElementById('matchInfo').innerText = "⏳ Bot ist dran...";
                botCalculated = false;
            } else {
                if (hit === "p1") p1_hp = Math.max(0, p1_hp - dmg);
                gameState.turn = me;
                document.getElementById('matchInfo').innerText = "🔴 DU BIST DRAN!";
                shootBtn.disabled = false;
                botCalculated = false;
            }

            if (p1_hp <= 0) {
                gameState.status = "gewonnen_Bot";
                document.getElementById('matchInfo').innerText = "❌ Der Bot hat dich zerstört!";
                shootBtn.disabled = true;
            } else if (p2_hp <= 0) {
                gameState.status = `gewonnen_${me}`;
                document.getElementById('matchInfo').innerText = "🎉 DU HAST GEWONNEN! 🎉";
                shootBtn.disabled = true;
            }

            st[0] = p1_hp; st[1] = p2_hp; st[4] = 100; st[5] = 100;
            gameState.raw_state = st.join(',');
            myXOffset = 0;
        }

        async function sendShotResult(angle, power, hit, finalP1X, finalP2X) {
            let amIErsteller = (me === gameState.ersteller);
            try {
                await fetch(`/api/tankroyale/shoot/${gameId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        angle: angle, power: power, hit: hit, 
                        waffenTyp: selectedWeapon,
                        new_p1_x: finalP1X, new_p2_x: finalP2X,
                        new_p1_fuel: amIErsteller ? Math.round(myFuel) : null,
                        new_p2_fuel: !amIErsteller ? Math.round(myFuel) : null,
                        updated_terrain: terrainPoints
                    })
                });
                myXOffset = 0;
                isAiming = false;
                updateStatus();
            } catch (e) { console.error(e); }
        }

        shootBtn.addEventListener('click', fireTank);

        function gameLoop() { 
            handleInput(); 
            draw(); 
            if (isBotMode && gameState.turn === "Computer-Bot 🤖" && !botCalculated && bullets.length === 0) {
                triggerBotTurn();
            }
            requestAnimationFrame(gameLoop); 
        }

        // Intervall-Update (Nur für Multiplayer)
        setInterval(() => {
            if (!isBotMode) updateStatus();
        }, 1500);

        initMatch();
        gameLoop();
    </script>
</body>
</html>
