<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Tank Royale Match</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #1a1a1a; color: white; margin: 0; padding: 10px; touch-action: none; }
        canvas { background: linear-gradient(to bottom, #111 60%, #1f1f2e 100%); border: 4px solid #ff9f43; border-radius: 8px; margin-top: 10px; max-width: 100%; height: auto; }
        .controls-info { background: #222; max-width: 900px; margin: 10px auto; padding: 15px; border-radius: 8px; font-size: 14px; color: #aaa; }
        .controls-info strong { color: #ff9f43; }
        .btn-shoot { background: #ff2e63; color: white; border: none; padding: 12px 30px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; width: 100%; max-width: 300px; }
        .btn-shoot:disabled { background: #555; cursor: not-allowed; }
        .button-row { display: flex; justify-content: center; gap: 20px; margin-top: 10px; }
        .btn-move { background: #333; color: white; border: 1px solid #555; padding: 10px 20px; font-size: 18px; border-radius: 5px; -webkit-user-select: none; user-select: none; }
    </style>
</head>
<body>
    <a href="/games" class="btn btn-back" style="margin-top:10px; display:inline-block;">⬅️ Zur Spieleliste</a>
    <h2 id="matchInfo">Verbinde zum Spiel...</h2>

    <canvas id="tankCanvas" width="900" height="500"></canvas>

    <div class="controls-info">
        🎮 <strong>Steuerung:</strong><br>
        🖥️ <strong>PC:</strong> Bewege die Maus zum Zielen, klicke auf "FEUER" oder drücke <kbd>A</kbd>/<kbd>D</kbd> zum Fahren.<br>
        📱 <strong>iPad/Touch:</strong> Ziehe mit dem Finger auf dem Spielfeld, um die Flugbahn zu steuern. Nutzen die Buttons unten zum Fahren!
        
        <div class="button-row">
            <button class="btn-move" id="moveLeftBtn">⬅️ Links fahren</button>
            <button class="btn-move" id="moveRightBtn">Rechts fahren ➡️</button>
        </div>
        
        <button class="btn-shoot" id="shootBtn" disabled>FEUER! 🔥</button>
    </div>

    <script>
        const gameId = "{{ gameId }}";
        const me = "{{ me }}";
        
        const canvas = document.getElementById('tankCanvas');
        const ctx = canvas.getContext('2d');
        const shootBtn = document.getElementById('shootBtn');
        const moveLeftBtn = document.getElementById('moveLeftBtn');
        const moveRightBtn = document.getElementById('moveRightBtn');

        let gameState = {};
        let bullet = null;
        const gravity = 0.15;

        // Dynamische Ziel-Variablen
        let myAngle = 45;
        let myPower = 12;
        let myXOffset = 0;

        // Mobile Buttons Halte-Status
        let moveLeftActive = false;
        let moveRightActive = false;

        // Tastatur für PC
        const keys = {};
        window.addEventListener('keydown', e => { keys[e.key] = true; });
        window.addEventListener('keyup', e => { keys[e.key] = false; });

        // Hügel-Gelände
        const terrainPoints = [];
        for (let x = 0; x <= canvas.width; x++) {
            let y = 400 + Math.sin(x * 0.008) * 40 + Math.cos(x * 0.02) * 10;
            terrainPoints.push(y);
        }

        // --- MAUS- & TOUCH-STEUERUNG (BERECHNUNG) ---
        function aimAtPoints(clientX, clientY) {
            if (gameState.turn !== me || gameState.status !== "aktiv" || bullet !== null) return;

            const rect = canvas.getBoundingClientRect();
            // Umrechnung von Display-Größe auf echte Canvas-Pixel (wichtig für iPads!)
            const mouseX = ((clientX - rect.left) / rect.width) * canvas.width;
            const mouseY = ((clientY - rect.top) / rect.height) * canvas.height;

            let amIErsteller = (me === gameState.ersteller);
            let currentX = amIErsteller ? gameState.p1_x + myXOffset : gameState.p2_x + myXOffset;
            let startY = terrainPoints[Math.floor(currentX)] - 15;

            // Vektor vom Panzer zum Maus-/Touch-Punkt berechnen
            let dx = mouseX - currentX;
            let dy = startY - mouseY; // Y im Canvas ist invertiert

            // Für den zweiten Spieler die Richtung spiegeln
            if (!amIErsteller) dx = -dx;

            // Winkel berechnen (Bogenmaß in Grad)
            let angle = Math.atan2(dy, dx) * (180 / Math.PI);
            if (angle < 0) angle = 0;
            if (angle > 90) angle = 90;

            // Kraft anhand der Entfernung schätzen (gedeckelt zwischen 5 und 20)
            let distance = Math.sqrt(dx*dx + dy*dy);
            let power = Math.min(20, Math.max(5, distance / 18));

            myAngle = angle;
            myPower = power;
        }

        // Event-Listener für Maus
        canvas.addEventListener('mousemove', (e) => aimAtPoints(e.clientX, e.clientY));

        // Event-Listener für Touch (iPad)
        canvas.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) {
                aimAtPoints(e.touches[0].clientX, e.touches[0].clientY);
            }
            e.preventDefault(); // Verhindert das Scrollen der Website beim Ziehen
        }, { passive: false });

        // Touch-Buttons fürs Fahren auswerten
        moveLeftBtn.addEventListener('mousedown', () => moveLeftActive = true);
        moveLeftBtn.addEventListener('mouseup', () => moveLeftActive = false);
        moveLeftBtn.addEventListener('touchstart', (e) => { moveLeftActive = true; e.preventDefault(); });
        moveLeftBtn.addEventListener('touchend', () => moveLeftActive = false);

        moveRightBtn.addEventListener('mousedown', () => moveRightActive = true);
        moveRightBtn.addEventListener('mouseup', () => moveRightActive = false);
        moveRightBtn.addEventListener('touchstart', (e) => { moveRightActive = true; e.preventDefault(); });
        moveRightBtn.addEventListener('touchend', () => moveRightActive = false);


        async function updateStatus() {
            if (!gameId || gameId.startsWith("{" + "{")) return;
            try {
                let res = await fetch(`/api/tankroyale/status/${gameId}`);
                if (!res.ok) return;
                gameState = await res.json();
                
                if (!gameState || !gameState.status) return;

                const isMyTurn = (gameState.turn === me && gameState.status === "aktiv");
                shootBtn.disabled = !isMyTurn || bullet !== null;

                if (gameState.status === "eingeladen") {
                    document.getElementById('matchInfo').innerText = "Warte darauf, dass der Gegner annimmt... ⏳";
                } else if (gameState.status.startsWith("gewonnen")) {
                    let winner = gameState.status.split('_')[1];
                    document.getElementById('matchInfo').innerText = winner === me ? "🎉 DU HAST GEWONNEN! 🎉" : `❌ ${winner} hat dich zerstört!`;
                    shootBtn.disabled = true;
                } else {
                    document.getElementById('matchInfo').innerText = isMyTurn ? "🔴 DU BIST DRAN!" : `⏳ ${gameState.turn} zielt...`;
                }
            } catch (e) {
                console.error(e);
            }
        }

        function handleInput() {
            if (gameState.turn !== me || gameState.status !== "aktiv" || bullet !== null) return;

            // Fahren via PC-Tastatur ODER iPad-Buttons
            if (keys['a'] || keys['A'] || moveLeftActive) myXOffset -= 1.5;
            if (keys['d'] || keys['D'] || moveRightActive) myXOffset += 1.5;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Boden zeichnen
            ctx.fillStyle = '#393e46';
            ctx.beginPath();
            ctx.moveTo(0, canvas.height);
            for (let x = 0; x <= canvas.width; x++) {
                ctx.lineTo(x, terrainPoints[x]);
            }
            ctx.lineTo(canvas.width, canvas.height);
            ctx.closePath();
            ctx.fill();

            // Gras
            ctx.strokeStyle = '#76ff03';
            ctx.lineWidth = 3;
            ctx.beginPath();
            for (let x = 0; x <= canvas.width; x++) {
                if (x === 0) ctx.moveTo(x, terrainPoints[x]);
                else ctx.lineTo(x, terrainPoints[x]);
            }
            ctx.stroke();

            if (!gameState || !gameState.status) return;

            let amIErsteller = (me === gameState.ersteller);
            
            let p1_x = Math.round(gameState.p1_x + (amIErsteller ? myXOffset : 0));
            let p2_x = Math.round(gameState.p2_x + (!amIErsteller ? myXOffset : 0));

            // Begrenzung, damit man nicht aus dem Bildschirm fährt
            p1_x = Math.max(20, Math.min(canvas.width - 20, p1_x));
            p2_x = Math.max(20, Math.min(canvas.width - 20, p2_x));

            let p1 = { x: p1_x, y: terrainPoints[p1_x] - 15, hp: gameState.p1_hp, color: '#00adb5', name: gameState.ersteller };
            let p2 = { x: p2_x, y: terrainPoints[p2_x] - 15, hp: gameState.p2_hp, color: '#ff2e63', name: gameState.gegner };

            // Panzer zeichnen
            ctx.fillStyle = p1.color; ctx.fillRect(p1.x - 20, p1.y, 40, 15);
            ctx.fillStyle = '#fff'; ctx.font = '12px Arial'; ctx.fillText(`${p1.name} (${p1.hp} HP)`, p1.x - 30, p1.y - 25);

            ctx.fillStyle = p2.color; ctx.fillRect(p2.x - 20, p2.y, 40, 15);
            ctx.fillStyle = '#fff'; ctx.fillText(`${p2.name} (${p2.hp} HP)`, p2.x - 30, p2.y - 25);

            // Flugbahn-Vorschau (Trajektorie)
            if (gameState.turn === me && gameState.status === "aktiv" && !bullet) {
                let activeTank = amIErsteller ? p1 : p2;
                let rad = (myAngle * Math.PI) / 180;
                
                let previewX = activeTank.x;
                let previewY = activeTank.y;
                let previewVx = Math.cos(rad) * myPower * (amIErsteller ? 1 : -1);
                let previewVy = -Math.sin(rad) * myPower;

                ctx.strokeStyle = 'rgba(249, 212, 35, 0.6)';
                ctx.lineWidth = 3;
                ctx.setLineDash([6, 6]);
                ctx.beginPath();
                ctx.moveTo(previewX, previewY);

                // Vorschau-Linie
                for (let i = 0; i < 20; i++) {
                    previewVy += gravity;
                    previewX += previewVx;
                    previewY += previewVy;
                    ctx.lineTo(previewX, previewY);
                }
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Kugel
            if (bullet) {
                bullet.vy += gravity;
                bullet.x += bullet.vx;
                bullet.y += bullet.vy;

                ctx.fillStyle = '#f9d423';
                ctx.beginPath(); ctx.arc(bullet.x, bullet.y, 6, 0, Math.PI * 2); ctx.fill();

                let target = amIErsteller ? p2 : p1;

                if (bullet.x > target.x - 20 && bullet.x < target.x + 20 && bullet.y > target.y && bullet.y < target.y + 15) {
                    sendShotResult(myAngle, myPower, amIErsteller ? "p2" : "p1", p1.x, p2.x);
                    bullet = null;
                } 
                else if (bullet.x >= 0 && bullet.x <= canvas.width && bullet.y > terrainPoints[Math.floor(bullet.x)]) {
                    sendShotResult(myAngle, myPower, "none", p1.x, p2.x);
                    bullet = null;
                }
                else if (bullet.y > canvas.height || bullet.x < 0 || bullet.x > canvas.width) {
                    sendShotResult(myAngle, myPower, "none", p1.x, p2.x);
                    bullet = null;
                }
            }
        }

        function fireTank() {
            if (gameState.turn !== me || gameState.status !== "aktiv" || bullet !== null) return;

            let rad = (myAngle * Math.PI) / 180;
            let amIErsteller = (me === gameState.ersteller);
            
            let currentX = amIErsteller ? gameState.p1_x + myXOffset : gameState.p2_x + myXOffset;
            currentX = Math.max(20, Math.min(canvas.width - 20, currentX));
            let startY = terrainPoints[Math.floor(currentX)] - 15;

            bullet = {
                x: currentX,
                y: startY,
                vx: Math.cos(rad) * myPower * (amIErsteller ? 1 : -1),
                vy: -Math.sin(rad) * myPower
            };
            shootBtn.disabled = true;
        }

        async function sendShotResult(angle, power, hit, finalP1X, finalP2X) {
            myXOffset = 0;
            try {
                await fetch(`/api/tankroyale/shoot/${gameId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ angle: angle, power: power, hit: hit, new_p1_x: finalP1X, new_p2_x: finalP2X })
                });
                updateStatus();
            } catch (e) {
                console.error(e);
            }
        }

        shootBtn.addEventListener('click', fireTank);

        function gameLoop() {
            handleInput();
            draw();
            requestAnimationFrame(gameLoop);
        }

        setInterval(updateStatus, 2000);
        updateStatus();
        gameLoop();
    </script>
</body>
</html>
